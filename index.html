  }, 50);
}

function updateExpenseKPIs(data = [], budget = null) {
  if (budget === null) {
    budget = expenseBudget || 0;
  }
  const branchId = state?.branchId;
  const filteredData = data.filter(item =>
    String(item.branchId || "").trim() === String(branchId || "").trim()
  );
  let totalExpense = 0;
  const categoryMap = {};
  filteredData.forEach(item => {
    const status = item.status || item.Status;
    // hanya hitung yang sudah dibayar
    if (status !== "Paid") return;
    const amount = Number(
      item.amount || item.Amount || 0
    );
    totalExpense += amount;
    const cat =
      item.category || item.Category || "Other";
    categoryMap[cat] =
      (categoryMap[cat] || 0) + amount;
  });

  // TOTAL EXPENSE
  const totalEl = document.getElementById("kpiTotalExpense");
  if (totalEl) {
    totalEl.innerText = `IDR ${totalExpense.toLocaleString("id-ID")}`;
  }
  // LARGEST CATEGORY
  let largestCategory = "-";
  let largestAmount = 0;
  for (let cat in categoryMap) {
    if (categoryMap[cat] > largestAmount) {
      largestAmount = categoryMap[cat];
      largestCategory = cat;
    }
  }
  const catEl = document.getElementById("kpiLargestCategory");
  const catAmtEl = document.getElementById("kpiLargestCategoryAmount");
  if (catEl) catEl.innerText = largestCategory;
  if (catAmtEl) catAmtEl.innerText = `IDR ${largestAmount.toLocaleString("id-ID")}`;
  // BUDGET FLOW
  const currentBudget =
    Number(budget || 0);
  const remaining =
    currentBudget - totalExpense;
    // USED % (TOTAL vs BUDGET)
    const usedPercent = currentBudget > 0
      ? (totalExpense / currentBudget) * 100
      : 0;
    const safeUsed = Math.max(0, Math.min(100, usedPercent));
    // REMAINING % (SUDAH PUNYA)
    const remainPercent = currentBudget > 0
      ? (remaining / currentBudget) * 100
      : 0;
    const safeRemain = Math.max(0, Math.min(100, remainPercent));
    //  CARD 1: TOTAL vs BUDGET
    const budgetTotalEl = document.getElementById("kpiBudgetTotal");
    if (budgetTotalEl) {
      budgetTotalEl.innerText = `/ IDR ${currentBudget.toLocaleString("id-ID")}`;
    }
    const usedBar = document.getElementById("kpiBudgetBar");
    if (usedBar) {
      usedBar.style.width = `${safeUsed}%`;
    }
    const utilText = document.getElementById("kpiBudgetUtilizedText");
    if (utilText) {
      utilText.innerText = `${safeUsed.toFixed(1)}% Budget Utilized`;
    }
    //  CARD 2: BUDGET REMAINING (JANGAN DIUBAH LOGICNYA)
    const percentEl = document.getElementById("kpiRemainingPercent");
    const remainEl = document.getElementById("kpiRemainingAmount");
    if (percentEl) {
      percentEl.innerText = `${safeRemain.toFixed(0)}%`;
    }
    if (remainEl) {
      remainEl.innerText = `IDR ${remaining.toLocaleString("id-ID")}`;
    }
    const remainBar = document.getElementById("expenseBudgetBar");
    if (remainBar) {
      remainBar.style.width = `${safeRemain}%`;
    }

    // MONTH LABEL
    const monthLabel = document.getElementById("kpiBudgetMonthLabel");
    if (monthLabel) {
      const monthName = new Date().toLocaleString("en-US", {
        month: "short"
      });
      monthLabel.innerText = `Left for ${monthName}`;
    }
    // TREND (bulan ini vs bulan lalu)
    const now = new Date();
    // FIX SAFE MONTH KEY (anti bug timezone)
    const thisMonth =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const lastMonthCalc =
      now.getMonth() === 0
        ? { y: now.getFullYear() - 1, m: 12 }
        : { y: now.getFullYear(), m: now.getMonth() };
    const lastMonth =
      `${lastMonthCalc.y}-${String(lastMonthCalc.m).padStart(2, "0")}`;
    let thisMonthTotal = 0;
    let lastMonthTotal = 0;

    filteredData.forEach(item => {
      const amount = Number(item.amount || 0);
      let itemMonth = "";
      if (item.tanggal instanceof Date) {
        itemMonth = item.tanggal.toISOString().slice(0, 7);
      } else if (typeof item.tanggal === "string") {
        itemMonth = item.tanggal.slice(0, 7);
      }
      if (itemMonth === thisMonth) thisMonthTotal += amount;
      if (itemMonth === lastMonth) lastMonthTotal += amount;
    });

  // TREND LOGIC (ANTI FAKE 100%)
  let trend = 0;
  if (thisMonthTotal === 0 && lastMonthTotal === 0) {
    trend = 0;
  } 
  else if (lastMonthTotal === 0) {
    trend = 0; // jangan paksa 100% biar gak misleading
  } 
  else {
    trend = ((thisMonthTotal - lastMonthTotal) / lastMonthTotal) * 100;
  }
  const safeTrend = isFinite(trend) ? trend : 0;
  // UI UPDATE
  const trendWrapper = document.getElementById("kpiExpenseTrend");
  const trendValue = document.getElementById("kpiExpenseTrendValue");
  const trendIcon = document.getElementById("kpiExpenseTrendIcon");
  if (trendValue) {
    trendValue.innerText = `${Math.abs(safeTrend).toFixed(1)}%`;
  }
  if (trendWrapper) {
    if (safeTrend >= 0) {
      trendWrapper.classList.add("text-error");
      trendWrapper.classList.remove("text-primary");
    } else {
      trendWrapper.classList.add("text-primary");
      trendWrapper.classList.remove("text-error");
    }
  }
  if (trendIcon) {
    trendIcon.innerText = safeTrend >= 0 ? "arrow_upward" : "arrow_downward";
  }
}

async function saveExpense() {

  const branchSelect =
    document.getElementById(
      "expenseBranchSelect"
    );

  if (!branchSelect) {
    showToast(
      "Branch tidak ditemukan",
      "error"
    );
    return;
  }


  const data = {

    branchId:
      branchSelect.value,
    tanggal:
      document.getElementById(
        "expenseDate"
      )?.value || "",
    category:
      document.getElementById(
        "expenseCategory"
      )?.value || "",
    description:
      document.getElementById(
        "expenseTitle"
      )?.value || "",
    amount:
      Number(
        (
          document.getElementById(
            "expenseAmount"
          )?.value || "0"
        ).replace(/[^\d]/g, "")
      ),
    method:
      selectedExpenseMethod,
    createdBy:
      state.userName || "Admin",

    type:
      "Expense",

    outlet:
      branchSelect.options[
        branchSelect.selectedIndex
      ]?.text || "",

    status:
      "Paid"
  };


  try {

    // =========================
    // SUPABASE RPC
    // =========================
    const res =
      await addExpenseRPC(data);

    // =========================
    // CHECK RESPONSE
    // =========================
    if (
      res &&
      res.success === false
    ) {
      throw new Error(
        res.message ||
        "Gagal menyimpan expense"
      );
    }

    // =========================
    // CLEAR CACHE
    // =========================
    state.cashFlowData = null;
    state.cashFlowFilter = null;
    state.expenseDashboardData = null;
    state.expenseDashboardFilter = null;


    // =========================
    // RELOAD
    // =========================
    await loadExpenseDashboard();

    showToast(
      "Expense berhasil disimpan",
      "success"
    );

  }
  catch (error) {

    console.error(
      "Save Expense Error:",
      error
    );

    const errText =
      error?.message ||
      JSON.stringify(error);


    let message =
      "Gagal menyimpan expense";
    if (
      errText.includes(
        "Saldo Cash tidak mencukupi"
      )
    ) {
      message =
        "Saldo Cash tidak mencukupi";
    }
    else if (
      errText.includes(
        "Saldo Bank tidak mencukupi"
      )
    ) {
      message =
        "Saldo Bank tidak mencukupi";
    }

    else if (errText) {
      message =
        errText;
    }

    showToast(
      message,
      "error"
    );

  }
}

function paginate(data) {
  const start = (currentPage - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageData = data.slice(start, end);
  renderExpenseTable(pageData);
  renderPagination(data); 
  document.getElementById("expenseTableInfo").innerText =
    `Showing ${start + 1} - ${Math.min(end, data.length)} of ${data.length}`;
}
	
function renderPagination(data) {
  const container = document.getElementById("pagination");
  if (!container) return;
  const totalPages = Math.ceil(data.length / itemsPerPage);
  let html = "";
  // ⬅ LEFT
 html += `
  <button class="chevron-left w-8 h-8 rounded-lg flex items-center justify-center transition-colors">
    <span class="material-symbols-outlined text-sm">chevron_left</span>
  </button>
`;
  // PAGES
  for (let i = 1; i <= totalPages; i++) {
    const isActive = i === currentPage;
    html += `
      <button data-page="${i}"
        class="page-btn w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold transition-colors
        ${isActive
          ? "bg-primary text-black"
          : "bg-white/5 hover:bg-primary/10"}">
        ${i}
      </button>
    `;
  }
  // ➡ RIGHT
 html += `
  <button class="chevron-right w-8 h-8 rounded-lg flex items-center justify-center transition-colors">
    <span class="material-symbols-outlined text-sm">chevron_right</span>
  </button>
`;
  container.innerHTML = html;
}

document.addEventListener("click", function(e) {
  const data = window.currentFilteredData || allExpenseData;
  if (e.target.closest(".chevron-left")) {
    if (currentPage > 1) {
      currentPage--;
      paginate(data);
    }
  }
  if (e.target.closest(".chevron-right")) {
    const maxPage = Math.ceil(data.length / itemsPerPage);
    if (currentPage < maxPage) {
      currentPage++;
      paginate(data);
    }
  }
  const btn = e.target.closest(".page-btn");
  if (btn) {
    currentPage = Number(btn.dataset.page);
    paginate(data);
  }
});

  else {

  }
}

      await closeSeasonRPC();

    console.log(
      "CLOSE SEASON RESULT:",
      res
    );

    // CHECK RESULT
    // ================================

    if (
      res &&
      res.success === false
    ) {

      throw new Error(
        res.message ||

      );

    }


    // ================================
    // CLEAR STATE
    // ================================

    state.seasonStatus =
      null;

    state.memberPageData =
      null;


    // ================================
    // LOAD ULANG SEASON
    // ================================

    await loadSeasonStatus();


    // ================================
    // NOTIFICATION
    // ================================

    showToast(
      `Season berhasil ditutup. ${
        res?.members_processed || 0
      } member diproses.`,
      "success"
    );

  }

  catch (err) {

    console.error(
      "Close Season:",
      err
    );

    showToast(
      err?.message ||

function updateSeasonUI(res) {
  const badge = document.getElementById("season_status_badge");
  if (!badge || !res) return;
  let status = res.status;
  // normalize dari backend
  if (status === "ACTIVE") status = "OPEN";
  if (status === "OPEN") status = "OPEN";
  if (status === "CLOSED") status = "CLOSED";
  if (status === "ON") status = "AUTO";
  badge.innerText = status;
  // RESET CLASS TOTAL (IMPORTANT)
  badge.className =
    "text-[10px] font-inter tracking-widest uppercase px-3 py-1 rounded-md";
  // APPLY STYLE
  switch (status) {
    case "OPEN":
      badge.classList.add("bg-green-500/20", "text-green-400");
      break;
    case "CLOSED":
      badge.classList.add("bg-red-500/20", "text-red-400");
      break;
    case "AUTO":
      badge.classList.add("bg-primary/20", "text-primary");
      break;
    default:
      badge.classList.add("bg-surface-container", "text-on-surface-variant");
  }
}

function initRewardPagination() {
  document
    .getElementById("rewardPrevBtn")
    ?.addEventListener(
      "click",
      () => changeRewardPage(-1)
    );
  document
    .getElementById("rewardNextBtn")
    ?.addEventListener(
      "click",
      () => changeRewardPage(1)
    );
}

async function loadRewardProducts() {

  const branchId =
    document.getElementById(
      "rewardBranchFilter"
    )?.value ||
    state.branchId;

  // CACHE
  if (
    state.rewardProducts &&
    state.rewardProductsBranchId === branchId
  ) {

    rewardData =
      state.rewardProducts;

    rewardPage = 1;

    renderRewardProductsTable();

    return;
  }

  try {

    const res =
      await getRewardProductsRPC(
        branchId
      );

    console.log(
      "REWARD PRODUCTS:",
      res
    );

    // =========================
    // AMBIL ARRAY REWARDS
    // =========================

    const data =
      Array.isArray(res)
        ? res
        : Array.isArray(res?.rewards)
          ? res.rewards
          : [];

    // CACHE
    state.rewardProducts =
      data;

    state.rewardProductsBranchId =
      branchId;

    // RENDER
    rewardData =
      state.rewardProducts;

    rewardPage = 1;

    renderRewardProductsTable();

  }
  catch (err) {

    console.error(
      "Load Reward Products:",
      err
    );

    showToast(
      err?.message ||
      "Gagal memuat reward.",
      "error"
    );
  }
}
	
function renderRewardProductsTable() {
  const tbody =
    document.getElementById("rewardTableBody");
  if (!tbody) return;
  tbody.innerHTML = "";
  const start =
    (rewardPage - 1) * rewardLimit;
  const data =
    rewardData.slice(
      start,
      start + rewardLimit
    );

  if (!data.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="4"
            class="py-12 text-center text-muted ">
          No reward products found
        </td>
      </tr>
    `;

    updateRewardPagination();
    return;
  }

  tbody.innerHTML = data
    .map(r => `
      <tr class="border-b border-white/10 hover:bg-white/5">

        <td class="px-6 py-4 font-medium">
          ${r.productName}
        </td>

        <td class="px-6 py-4">
          ${r.category}
        </td>

        <td class="px-6 py-4 text-center font-bold text-primary">
          ${r.point} Pts
        </td>

        <td class="px-6 py-4">
          <div class="flex justify-end gap-2">
            <button
              onclick="deleteReward('${r.id}')"
              class="w-8 h-8
                     hover:text-red-400
                     flex items-center justify-center
                     transition-all">
              <span class="material-symbols-outlined text-[15px]">
                delete
              </span>
            </button>
          </div>
        </td>

      </tr>
    `)
    .join("");
  updateRewardPagination();
}

function changeRewardPage(step) {
  const totalPages =
    Math.ceil(
      rewardData.length / rewardLimit
    ) || 1;
  const newPage =
    rewardPage + step;
  if (
    newPage < 1 ||
    newPage > totalPages
  ) {
    return;
  }
  rewardPage = newPage;
  renderRewardProductsTable();
}

function updateRewardPagination() {
  const totalPages =
    Math.ceil(
      rewardData.length /
      rewardLimit
    ) || 1;
  document.getElementById(
    "rewardPrevBtn"
  ).disabled =
    rewardPage <= 1;
  document.getElementById(
    "rewardNextBtn"
  ).disabled =
    rewardPage >= totalPages;
}
	
async function deleteReward(id) {

  if (
    !confirm(
      "Hapus reward ini?"
    )
  ) {
    return;
  }

  try {

    // =========================
    // SUPABASE RPC
    // =========================

    const res =
      await deleteRewardRPC(id);

    console.log(
      "DELETE REWARD:",
      res
    );

    if (!res?.success) {
      throw new Error(
        res?.message ||
        "Gagal menghapus reward"
      );
    }

    // =========================
    // CLEAR CACHE
    // =========================

    state.rewardProducts = null;
    state.rewardProductsBranchId = null;

    // =========================
    // RELOAD
    // =========================

    await loadRewardProducts();

    showToast(
      "Reward berhasil dihapus.",
      "success"
    );

  }
  catch (err) {

    console.error(
      "Delete Reward:",
      err
    );

    showToast(
      err?.message ||
      "Gagal menghapus reward",
      "error"
    );
  }
}
	
function loadRewardBranch(){
  const select =
    document.getElementById("rewardBranch");
  if(!select) return;
  const branch =
    allBranches.find(
      b => b.branchId === state.branchId
    );
  select.innerHTML = `
    <option value="${state.branchId}">
      ${
        branch
        ? branch.branchName
        : state.branchId
      }
    </option>
  `;
  select.value = state.branchId;
  select.disabled = true;
}

function openAddRewardModal() {
  document.body.insertAdjacentHTML(
    "beforeend",
    document.getElementById("addRewardModalTemplate").innerHTML
  );
  loadRewardBranch();
  setTimeout(() => {
    loadRewardProductsForModal();
  }, 50);
}

function closeAddRewardModal() {

async function loadCashFlowPage() {

  const filter = {

    loginUserId:
      state.user.id,

    branchId:
      document.getElementById(
        "cf-branch"
      )?.value ||
      state.branchId,

    startDate:
      document.getElementById(
        "cf-start-date"
      )?.value || "",

    endDate:
      document.getElementById(
        "cf-end-date"
      )?.value || ""

  };
console.log(
    "CF FILTER:",
    filter
  );

  console.log(
    "CF BRANCH VALUE:",
    document.getElementById(
      "cf-branch"
    )?.value
  );
  const cacheKey =
    JSON.stringify(filter);


  // =========================
  // CACHE HIT
  // =========================

  if (
    state.cashFlowData &&
    state.cashFlowFilter === cacheKey
  ) {

    renderAccountBalance(
      state.cashFlowData.account
    );

    renderCashFlowSummary(
      state.cashFlowData.summary
    );

    renderCashFlowChart(
      state.cashFlowData.chart
    );

    renderTransferHistory(
      state.cashFlowData.transfers || []
    );

    renderOwnerSummary(
      state.cashFlowData.ownerSummary
    );

    renderOwnerHistory(
      state.cashFlowData.ownerTransactions || []
    );

    return;
  }


  try {

    console.log(
      "SERVER CALL get_cash_flow_page_data"
    );


    // =========================
    // SUPABASE RPC
    // =========================

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_cash_flow_page_data",
        {
          p_login_user_id:
            Number(
              filter.loginUserId
            ),

          p_branch_id:
            filter.branchId ||
            "ALL",

          p_start:
            filter.startDate ||
            null,

          p_end:
            filter.endDate ||
            null
        }
      );


    if (error) {
      throw error;
    }


    // =========================
    // ACCESS CHECK
    // =========================

    if (
      data &&
      data.success === false
    ) {

      showToast(
        data.message ||
        "Access denied.",
        "error"
      );

      return;
    }


    // =========================
    // CACHE
    // =========================

    state.cashFlowData =
      data || {};

    state.cashFlowFilter =
      cacheKey;


    // =========================
    // RENDER
    // =========================

    renderAccountBalance(
      data?.account
    );

    renderCashFlowSummary(
      data?.summary
    );

    renderCashFlowChart(
      data?.chart
    );

    renderTransferHistory(
      data?.transfers || []
    );

    renderOwnerSummary(
      data?.ownerSummary
    );

    renderOwnerHistory(
      data?.ownerTransactions || []
    );

  }
  catch (err) {

    console.error(
      "Cash Flow:",
      err
    );

    showToast(
      err?.message ||
      "Gagal memuat Cash Flow.",
      "error"
    );
  }
}

async function loadCashFlowBranchOptions() {

  // CACHE
  if (state.cashFlowBranches) {

    renderCashFlowBranchOptions(
      state.cashFlowBranches
    );

    return;
  }

  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "get_expense_branches"
    );

    if (error) {
      throw error;
    }

    // NORMALIZE DATA
    state.cashFlowBranches =
      data || [];

    renderCashFlowBranchOptions(
      state.cashFlowBranches
    );

  }
  catch (err) {

    console.error(
      "Load Cash Flow Branch Options:",
      err
    );

    showToast(
      err?.message ||
      "Gagal memuat branch.",
      "error"
    );
  }
}

    );

  }
}

function renderCashFlowSummary(data) {
  // KPI
  document.getElementById("cf-cashin").textContent =
    formatRupiah(data.income);
  document.getElementById("cf-cashout").textContent =
    formatRupiah(data.expense);
  document.getElementById("cf-net").textContent =
    formatRupiah(data.netFlow);
  document.getElementById("cf-balance").textContent =
    formatRupiah(data.balance);

  // INCOME SOURCES
  const total =
    data.income || 0;
  const salesPercent =
    total
      ? (data.sales / total) * 100
      : 0;
  const otherPercent =
    total
      ? (data.otherIncome / total) * 100
      : 0;
  document.getElementById("cf-sales").textContent =
    formatRupiah(data.sales);
  document.getElementById("cf-income").textContent =
    formatRupiah(data.otherIncome);
  document.getElementById("cf-total-in").textContent =
    formatRupiah(total);
  document.getElementById("cf-sales-percent").textContent =
    salesPercent.toFixed(1) + "%";
  document.getElementById("cf-income-percent").textContent =
    otherPercent.toFixed(1) + "%";
  document.getElementById("cf-sales-bar").style.width =
    salesPercent + "%";
  document.getElementById("cf-income-bar").style.width =
    otherPercent + "%";
  // EXPENSE CATEGORIES
  const totalOut =
    data.expense || 0;
  const operationPercent =
    totalOut > 0
      ? (data.operationExpense / totalOut) * 100
      : 0;
  const purchasePercent =
    totalOut > 0
      ? (data.ingredientPurchase / totalOut) * 100
      : 0;
  // Nominal
  document.getElementById("cf-expenses").textContent =
    formatRupiah(data.operationExpense);
  document.getElementById("cf-purchases").textContent =
    formatRupiah(data.ingredientPurchase);
  document.getElementById("cf-total-out").textContent =
    formatRupiah(totalOut);
  // Persentase
  document.getElementById("cf-expenses-percent").textContent =
    operationPercent.toFixed(1) + "%";
  document.getElementById("cf-purchases-percent").textContent =
    purchasePercent.toFixed(1) + "%";
  // Progress Bar
  document.getElementById("cf-expenses-bar").style.width =
    operationPercent + "%";
  document.getElementById("cf-purchases-bar").style.width =
    purchasePercent + "%";
}


function renderCashFlowChart(data){
  const container =
    document.getElementById(
      "cash-flow-chart"
    );

  if(!container) return;
  container.innerHTML = "";
  const max = Math.max(
    ...data.cashIn,
    ...data.cashOut,
    1
  );

  data.labels.forEach((label,index)=>{
    const inHeight =
      Math.round(
        data.cashIn[index] /
        max *
        240
      );
    const outHeight =
      Math.round(
        data.cashOut[index] /
        max *
        240
      );
    container.innerHTML += `
<div class="flex flex-col items-center flex-1">
  <div
    class="h-[240px]
    flex items-end gap-2">

    <div
      class="w-5 bg-primary"
      style="height:${inHeight}px">
    </div>

    <div
      class="w-5 bg-white/15"
      style="height:${outHeight}px">
    </div>
  </div>
  <span
    class="mt-4
    text-xs
    text-on-surface-variant">
    ${label}
  </span>
</div>
`;
  });
}

async function saveTransfer() {

  const data = {

    branchId:
      state.branchId,

    fromAccount:
      document.getElementById(
        "tf-from"
      )?.value,

    toAccount:
      document.getElementById(
        "tf-to"
      )?.value,

    amount:
      Number(
        document.getElementById(
          "tf-amount"
        )?.value || 0
      ),

    note:
      document.getElementById(
        "tf-note"
      )?.value || "",

    createdBy:
      state.user?.username ||
      "Admin"
  };


  // =========================
  // VALIDASI
  // =========================

  if (
    !data.amount ||
    data.amount <= 0
  ) {

    showToast(
      "Jumlah transfer harus diisi",
      "warning"
    );

    return;
  }


  try {

    // =========================
    // SUPABASE RPC
    // =========================

    const res =
      await transferFundsRPC(data);


    // =========================
    // RESPONSE
    // =========================

    if (
      res &&
      res.success === false
    ) {

      throw new Error(
        res.message ||
        "Transfer gagal"
      );
    }


    showToast(
      res?.message ||
      "Transfer berhasil",
      "success"
    );


    // =========================
    // CLEAR CACHE
    // =========================

    state.cashFlowData = null;
    state.cashFlowFilter = null;


    closeTransferModal();


    // =========================
    // RELOAD
    // =========================

    await loadCashFlowPage();

  }
  catch (err) {

    console.error(
      "Transfer Funds:",
      err
    );

    showToast(
      err?.message ||
      "Transfer gagal",
      "error"
    );
  }
}

function extractAnalyticsDate(text){
  const months = {
    januari:"01",
    februari:"02",
    maret:"03",
    april:"04",
    mei:"05",
    juni:"06",
    juli:"07",
    agustus:"08",
    september:"09",
    oktober:"10",
    november:"11",
    desember:"12"
  };
  const match =
    text.match(
      /(\d{1,2})\s+(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)\s+(\d{4})/i
    );
  if(!match){
    return null;
  }
  const day =
    match[1].padStart(2,"0");
  const month =
    months[
      match[2].toLowerCase()
    ];
  const year =
    match[3];
  return `${year}-${month}-${day}`;
}

function extractAnalyticsMonth(text){
  const months = {
    januari:0,
    februari:1,
    maret:2,
    april:3,
    mei:4,
    juni:5,
    juli:6,
    agustus:7,
    september:8,
    oktober:9,
    november:10,
    desember:11
  };

  for(const month in months){
    if(text.includes(month)){
      const year =
        new Date().getFullYear();
      const start =
        new Date(
          year,
          months[month],
          1
        );
      const end =
        new Date(
          year,
          months[month]+1,
          0
        );
      return {
        start:
          formatLocalDate(start),
        end:
          formatLocalDate(end)
      };
    }
  }
  return null;
}

function extractAnalyticsRange(text){
  const now = new Date();
  // KEMARIN
  if(text.includes("kemarin")){

    const d = new Date(now);
    d.setDate(
      d.getDate()-1
    );
    const date =
      formatLocalDate(d);
    return {
      start:date,
      end:date
    };
  }
  // HARI INI
  if(text.includes("hari ini")){
    const date =
      formatLocalDate(now);
    return {
      start:date,
      end:date
    };
  }
  // MINGGU INI
  if(text.includes("minggu ini")){
    const day = now.getDay();
    const diff =
      day === 0
        ? -6
        : 1 - day;
    const start = new Date(now);
    start.setDate(
      now.getDate() + diff
    );
    return {
      start: formatLocalDate(start),
      end: formatLocalDate(now)
    };
  }

  // BULAN INI
  if(text.includes("bulan ini")){
    const start =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );
    return {
      start:
        formatLocalDate(start),
      end:
        formatLocalDate(now)
    };
  }
  return null;
}



// MATCH INTENT
function matchIntent(cmd, keywords){
  return keywords.some(keyword =>
    cmd.includes(keyword)
  );
}

function formatLocalDate(date){
  const year =
    date.getFullYear();
  const month =
    String(date.getMonth()+1)
    .padStart(2,"0");
  const day =
    String(date.getDate())
    .padStart(2,"0");
  return `${year}-${month}-${day}`;
}

function handleBackupCommand(message){
  const cmd =
    message.toLowerCase().trim();

  // ANALYTICS
  if(matchIntent(cmd, analyticsIntents.NET_PROFIT) ||
     matchIntent(cmd, analyticsIntents.REVENUE) ||
     matchIntent(cmd, analyticsIntents.TOP_PRODUCT)||
     matchIntent(cmd, analyticsIntents.PEAK_HOURS) ||
     matchIntent(cmd, analyticsIntents.PAYMENT) ||
     matchIntent(cmd, analyticsIntents.STOCK_ALERT)
     ){
      handleAnalyticsCommand(message);
    return;
  }
  // RESTORE
  if(matchIntent(cmd, intents.RESTORE)){
    loadBackupList();
    return;
  }
  // DELETE BACKUP
  if(matchIntent(cmd, intents.DELETE_BACKUP)){
    loadBackupList();
    return;
  }
  // CHECK DATABASE
  if(matchIntent(cmd, intents.CHECK_DATABASE)){
    loadBackupList();
    return;
  }
  // CLEAR DATABASE
  if(matchIntent(cmd, intents.CLEAR_DATABASE)){
    clearDatabaseConfirm();
    return;
  }
  // BACKUP
  if(matchIntent(cmd, intents.BACKUP)){
    setTimeout(()=>{
      addBackupChatMessage(
        "bot",
        `
        <b>Backup Database</b>
        <br><br>

        Saya siap membuat full backup
        seluruh data Sistem POS.

        <br><br>
		
        Konfirmasi backup?
        <br><br>
        <div class="flex justify-center">
          <button
          onclick="startBackupProcess()"
          class="px-4 py-2 rounded-md bg-primary/10 border border-primary/10 text-primary text-xs">
            BACKUP NOW
          </button>
        </div>
        `
      );
    },500);
    return;
  }
  // UNKNOWN
  addBackupChatMessage(
    "bot",
    "Maaf, saya belum memahami perintah tersebut."
  );
}

        "#btnExportCashFlowPDF"
      );

    if (!btn) return;

    exportCashFlowReport();

  }
);


async function exportCashFlowReport() {

  const startDate =
    document.getElementById(
      "cf-start-date"
    )?.value || "";

  const endDate =
    document.getElementById(
      "cf-end-date"
    )?.value || "";

  const branch =
    document.getElementById(
      "cf-branch"
    )?.value ||
    state?.branchId ||
    "ALL";

  // =========================
  // LOGIN USER
  // =========================

  const loginUserId =
    state?.user?.id || "";

  // =========================
  // VALIDASI
  // =========================

  if (!startDate || !endDate) {

    alert(
      "Pilih tanggal dulu"
    );

    return;
  }

  if (!branch) {

    alert(
      "Branch tidak valid"
    );

    return;
  }

  if (!loginUserId) {

    console.error(
      "LOGIN USER ID KOSONG:",
      state?.user
    );

    alert(
      "User login tidak ditemukan."
    );

    return;
  }

  // =========================
  // DEBUG
  // =========================

  console.log(
    "EXPORT CASH FLOW:",
    {
      loginUserId,
      branch,
      startDate,
      endDate
    }
  );

  // =========================
  // OPEN WINDOW
  // =========================

  const pdfWindow =
    window.open(
      "",
      "_blank"
    );

  if (!pdfWindow) {

    alert(
      "Popup diblokir browser."
    );

    return;
  }

  // =========================
  // LOADING
  // =========================

  pdfWindow.document.write(`

    <html>

      <head>

        <title>
          Generating Cash Flow Report
        </title>

        <style>

          body {

            margin: 0;

            background: #0B0F14;

            color: white;

            font-family: Arial, sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            height: 100vh;

          }

          .loading {

            text-align: center;

          }

          .title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 8px;

          }

          .text {

            font-size: 13px;

            opacity: .7;

          }

        </style>

      </head>

      <body>

        <div class="loading">

          <div class="title">
            Cash Flow Report
          </div>

          <div class="text">
            Generating PDF...
          </div>

        </div>

      </body>

    </html>

  `);

  try {

    // =========================
    // CALL VERCEL API
    // =========================

    const response =
      await fetch(
        "/api/export-cash-flow-pdf",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            loginUserId:
              loginUserId,

            branchId:
              branch,

            start:
              startDate,

            end:
              endDate

          })

        }
      );

    // =========================
    // HTTP ERROR
    // =========================

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        `Export gagal (${response.status})`
      );

    }

    // =========================
    // GET HTML REPORT
    // =========================

    const html =
      await response.text();

    if (!html) {

      throw new Error(
        "Server mengembalikan HTML kosong"
      );

    }

    console.log(
      "EXPORT CASH FLOW HTML RECEIVED"
    );

    // =========================
    // RENDER REPORT
    // =========================

    pdfWindow.document.open();

    pdfWindow.document.write(
      html
    );

    pdfWindow.document.close();

  }

  catch (err) {

    console.error(
      "Export Cash Flow:",
      err
    );

    // =========================
    // ERROR PAGE
    // =========================

    pdfWindow.document.open();

    pdfWindow.document.write(`

      <html>

        <body style="
          background:#0B0F14;
          color:white;
          font-family:Arial;
          padding:40px;
        ">

          <h2>
            Export Failed
          </h2>

          <p style="
            color:#aaa;
          ">
            Gagal membuat Cash Flow Report.
          </p>

          <pre style="
            white-space:pre-wrap;
            background:#151A21;
            padding:15px;
            border-radius:10px;
          ">${String(
            err?.message ||
            err
          )}</pre>

        </body>

      </html>

    `);

    pdfWindow.document.close();

  }
}
