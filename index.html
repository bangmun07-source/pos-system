	<script>
	 
	  document.addEventListener(
		  "input",
		  async function(e) {
		
		    if (
		      e.target.id === "memberSearch"
		    ) {
		
		      const keyword =
		        e.target.value
		          .toLowerCase();
		
		      if (!keyword) {
		
		        document.getElementById(
		          "memberResult"
		        ).style.display = "none";
		
		        return;
		      }
		
		      try {
		
		        const data =
		          await searchMembersRPC(
		            keyword,
		            state.branchId
		          );
		
		        console.log(
		          "MEMBER SEARCH:",
		          keyword
		        );
		
		        console.log(
		          "BRANCH:",
		          state.branchId
		        );
		
		        console.log(
		          "RESULT:",
		          data
		        );
		
		        showMemberResult(
		          data
		        );
		
		      } catch (err) {
		
		        console.error(
		          "Search Member:",
		          err
		        );
		      }
		    }
		  }
		);
		
		
		// ================================
		// TAMPILKAN HASIL MEMBER
		// ================================
		
		function showMemberResult(data) {
		
		  const box =
		    document.getElementById(
		      "memberResult"
		    );
		
		  if (!box) return;
		
		  box.innerHTML = "";
		
		  if (
		    !data ||
		    data.length === 0
		  ) {
		
		    box.style.display =
		      "none";
		
		    return;
		  }
		
		  data.forEach(m => {
		
		    const div =
		      document.createElement(
		        "div"
		      );
		
		    div.style.padding =
		      "10px";
		
		    div.style.cursor =
		      "pointer";
		
		    div.innerHTML =
		      `<b>${m.nama}</b>
		       <br>
		       <small>${m.level}</small>`;
		
		    div.onclick = () => {
		
		      setValue(
		        "memberSearch",
		        m.nama
		      );
		
		      setValue(
		        "member-id",
		        m.id
		      );
		
		      state.currentMember =
		        m.id;
		
		      box.style.display =
		        "none";
		    };
		
		    box.appendChild(div);
		
		  });
		  box.style.display =
		    "block";
		}
  </script>

	<script>
		const card = document.getElementById("businessCard");
		if(card){
			card.addEventListener("mousemove",(e)=>{
				const rect = card.getBoundingClientRect();
				const x = e.clientX - rect.left;
				const y = e.clientY - rect.top;
				const centerX = rect.width/2;
				const centerY = rect.height/2;
				const rotateY = ((x-centerX)/centerX)*10;
				const rotateX = ((centerY-y)/centerY)*10;
				card.style.transform = `
					perspective(1200px)
					rotateX(${rotateX}deg)
					rotateY(${rotateY}deg)
					scale(1.02)
				`;
			});
			
			card.addEventListener("mouseleave",()=>{
				card.style.transform = `
					perspective(1200px)
					rotateX(0deg)
					rotateY(0deg)
					scale(1)
				`;
			});
		}

let sidebarOpen = false;

function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");

    if (!sidebar) return;

    sidebarOpen = !sidebarOpen;

    if (sidebarOpen) {
        sidebar.style.width = "18rem"; // w-72
    } else {
        sidebar.style.width = "4rem";  // w-16
    }
}


// CLOSE SAAT TAP DI LUAR — KHUSUS HP
document.addEventListener("click", function (e) {

    if (window.innerWidth >= 768) return;

    const sidebar = document.getElementById("sidebar");

    if (!sidebar || !sidebarOpen) return;

    // Tap di dalam sidebar → jangan close
    if (sidebar.contains(e.target)) return;

    // Tap di luar → close
    sidebarOpen = false;
    sidebar.style.width = "4rem";
});



let billingOpen = false;

function toggleBillingSidebar(mode = "table") {

  const sidebar =
    document.getElementById("billingSidebar");

  billingOpen = !billingOpen;


  const width =
    mode === "pos"
      ? "w-[520px]"
      : "w-[350px]";


  if (billingOpen) {

    sidebar.classList.remove(
      "translate-x-[120%]",
      "opacity-0",
      "pointer-events-none",
      "w-0",
      "w-[350px]",
      "w-[520px]"
    );

    sidebar.classList.add(width);


  } else {

    sidebar.classList.add(
      "translate-x-[120%]",
      "opacity-0",
      "pointer-events-none",
      "w-0"
    );

    sidebar.classList.remove(
      "w-[350px]",
      "w-[520px]"
    );

  }

}

function bootApp(targetPage = "dashboardPage") {

  const ok = restoreSession();
  if (!ok) { navigate("loginPage");
    return;
  }

  state.user =
    JSON.parse(localStorage.getItem("pos_user"));

  state.branchId = localStorage.getItem("pos_branchId");

  if (!state.branchId && state.user?.branchId ) {
      state.branchId = state.user.branchId;
  }
  window.__ACTIVE_PAGE =  targetPage;
  navigate(targetPage);
}

function restoreSession() {
  const user = localStorage.getItem("pos_user");
  const branchId = localStorage.getItem("pos_branchId");
    if (!user) return false;
  
  state.user = JSON.parse(user);
  state.branchId = branchId;
  
  return true;
}

function navigate(pageId, params = {}) {

  const role =
    state.user?.role?.toLowerCase() || "";
	
    if (params.roles) {

      const allowedRoles = params.roles.map(r => r.toLowerCase());

      if (!allowedRoles.includes(role)) {
        alert("You do not have permission to access this page.");
        return;
      }
    }

  // OWNER ONLY PAGE
  const ownerPages = [
    "cashFlowPage"
  ];

  if (ownerPages.includes(pageId) && role !== "owner") {
    showToast("Access denied");
    return;
  }
  const template = document.getElementById(pageId);
  const app = document.getElementById("app");

  if (!template || !app) {
    return;
  }

  app.innerHTML = "";
  document.querySelectorAll(".page-overlay").forEach(e => e.remove());
  app.appendChild(template.content.cloneNode(true));
  setTimeout(() => {
    loadBranchName();
  }, 0);

  // HEADER USER
  const headerUsername = document.getElementById("headerUsername");
  const headerRole = document.getElementById("headerRole");

  if (headerUsername) {headerUsername.textContent = state.user?.username || "-";}
  if (headerRole) {headerRole.textContent = state.user?.role || "-";}

  // SETTINGS MENU
  // Owner + Admin
  document.querySelectorAll(".settingsMenu").forEach(menu => {
    menu.style.display =
      (role === "owner" || role === "admin")
        ? "flex"
        : "none";
  });

  // OWNER ONLY MENU
  document.querySelectorAll(".ownerOnly").forEach(menu => {
    menu.style.display =
      (role === "owner")
        ? "flex"
        : "none";
  });

  currentPage = pageId;

  if (window.dashboardInterval) {
    clearInterval(window.dashboardInterval);
    window.dashboardInterval = null;
  }

  setTimeout(() => {
    initModule(pageId, params);
  }, 50);

}

async function handleLogin() {

	const username =
	  document.getElementById("username").value.trim();
	const password =
	  document.getElementById("password").value.trim();
	
	try {
	  const result =
	    await loginUserRPC(
	      username,
	      password
	    );
	
	  if(!result || !result.success){
	    alert(
	      "Username atau password salah"
	    );
	    return;
	  }
	
	  const user =
	    result.user;
	  state.user = user;
	  state.branchId =
	    user.branchId || "";
	  localStorage.setItem(
	    "pos_user",
	    JSON.stringify(user)
	  );
	
	  if(state.branchId){
	    localStorage.setItem(
	      "pos_branchId",
	      state.branchId
	    );
	  }
	  navigate(
	    "dashboardPage"
	  );
	}
	catch(err){
	  console.error(
	    "Login error:",
	    err
	  );
	  alert(
	    err.message ||
	    "Login gagal"
	  );
	}
}

function initApp() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page");
  const user = localStorage.getItem("pos_user");
      
  if (!user) {
    navigate(
      "loginPage"
    );
    return;
  }

  state.user = JSON.parse(user);
  const role = state.user?.role?.toLowerCase();

  // ==========================
  // BRANCH CONTEXT
  // ==========================
  if(role === "owner") {
    // owner ambil branch terakhir yang dipilih
    state.branchId =
      localStorage.getItem(
        "pos_branchId"
      ) || "";
        
  } else {
    // admin / kasir
    state.branchId =
      state.user?.branchId ||
      localStorage.getItem(
        "pos_branchId"
      ) ||
      "";
  }

  console.log(
    "ROLE:",
    role,
    "BRANCH:",
    state.branchId
  );

  if(page) {
    window.__ACTIVE_PAGE =
      page;
    navigate(page);
    return;
  }

  navigate(
    "dashboardPage"
  );
}

function formatPercent(val) {

}

function formatDate(date) {
  if (!date) return "-";
  return new Date(date).toLocaleDateString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function formatDate(date) {
  if (!date) return "-";
  let d;
  if (typeof date === "string") {
    d = new Date(date.replace(" ", "T"));
  } else {
    d = new Date(date);
  }
  if (isNaN(d.getTime())) {
    return "-";
  }
  return d.toLocaleString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatRupiah(num) {
  return "IDR " + Number(num).toLocaleString("id-ID");
}
	
let clockInterval;
function startClock() {
  if (clockInterval) clearInterval(clockInterval);
  updateDateTime();
  clockInterval = setInterval(updateDateTime, 1000);
}

function initModule(pageId) {

  switch(pageId) {
    case "dashboardPage":
        loadDashboard();
        startClock();
    break;

    case "grossRevenuePage": {
      initDatePicker();

      const startEl = document.getElementById("startDate");
      const endEl = document.getElementById("endDate");

      if (!startEl || !endEl) break;

      const today = new Date();
      const past = new Date();

      past.setDate(today.getDate() - 7);

      startEl.value = past.toISOString().split("T")[0];
      endEl.value = today.toISOString().split("T")[0];

      updateDateLabel(  startEl.value, endEl.value );
      loadGrossRevenuePage();
      break;
    }
		  
    case "recentTransactionsPage":{
          const startEl = document.getElementById("startDate");
          const endEl = document.getElementById("endDate");
          if (startEl && endEl) {
            const today = new Date();
            const past = new Date();
            past.setDate(today.getDate() - 7);

            startEl.value = past.toISOString().split("T")[0];
            endEl.value = today.toISOString().split("T")[0];
          }
          // 1. INIT LISTENER DULU
          initTransactionFilters();
          // 2. BARU LOAD DATA
          loadRecentTransactionsPage();
          loadRecentTransactionSummary();
    break;
    }

    case "posPage":
      resetPOSMember();
      waitBranch(() => {
        loadNotifications();
        loadProducts(() => {
          initSearch();
        });
    
        fetchSettings(() => {
          renderCart();
        });
        preloadRecipeMap();
        loadRecipes(state.branchId);
      });
    break;
		  
    case "orderPage":
      loadOrders(state.branchId);
    break;

    case "memberPage":
      waitBranch(() => {
        loadMembers(() => {
          loadMemberStats();
          loadMemberGrowth();
          loadNotifications();
          initMemberSearch();
          initTierFilter();
          initMemberExport();
        });
      });
    break;

    case "tablePage":
        loadTables(state.branchId);
    break;

    case "inventoryPage":
      waitBranch(() => {
        loadInventoryPage(state.branchId);
        initIngredientExportDate();
      });
    break;

    case "analyticsPage": {
      initAnalyticsDate();
      loadAnalyticsPage();
    break;
    }
   
    case "settingsPage":
      loadSettingsPage();
    break;

    case "loyaltysettingPage":
      initLoyaltyPage();
    break;

    case "expensessettingPage":{
        const startEl = document.getElementById("expenseStartDate");
        const endEl = document.getElementById("expenseEndDate");
        const today = new Date();
        const past = new Date();
        past.setDate(today.getDate() - 6);
        if (startEl) { startEl.value = past.toISOString().split("T")[0]; }
        if (endEl) { endEl.value = today.toISOString().split("T")[0]; }
        initExpenseSettingPage();
        initOtherIncomeEvents();
    break;
    }

    case "cashFlowPage":
      initCashFlowPage();
      loadCashFlowNotification()
    break;

  }
}

async function loadDashboard() {
  const branchId =
    state.branchId;
  const cacheKey =
    JSON.stringify({
      branchId: branchId
    });
  if (
    state.dashboardData &&
    state.dashboardFilter === cacheKey
  ) {
    renderDashboard(
      state.dashboardData
    );
    return;
  }
  if (!branchId) {
    return;
  }
  try {
    const dashboardData =
      await getDashboardDataRPC(
        branchId
      );
    console.log(
      "DASHBOARD RPC RESULT:",
      dashboardData
    );
    state.dashboardData =
      dashboardData || {};
    state.dashboardFilter =
      cacheKey;
    renderDashboard(
      state.dashboardData
    );
  }
  catch(err) {
    console.error(
      "Dashboard error:",
      err
    );
    showToast(
      "Gagal memuat dashboard",
      "error"
    );
  }
}

function updateDateTime() {
  const dateEl = document.getElementById("dash-date");
  const timeEl = document.getElementById("dash-time");

  if (!dateEl || !timeEl) return; 

  const now = new Date();

  const date = now.toLocaleDateString("id-ID", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });

  const time = now.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  });

  dateEl.innerText = date;
  timeEl.innerText = time;
}

function renderDashboard(data) {
  if (!data) return;

  const safeSet = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.innerText = value;
  };

  renderLowStock(data.lowStock || []);
  renderRecentTransactions(data.recentTransactions || []);
  renderShiftPerformance(data.shift || {});

  const revenue = data.revenue || data.summary?.totalRevenue || 0;
  const orders = data.orders || data.summary?.orders || 0;
  const aov = data.aov || data.summary?.aov || 0;

  safeSet("dash-revenue", format(revenue));
  safeSet("dash-orders", orders);
  safeSet("dash-aov", format(aov));

  safeSet("dash-revenue-growth", formatPercent(data.growth?.revenue || 0));
  safeSet("dash-orders-growth", formatPercent(data.growth?.orders || 0));
  safeSet("dash-aov-growth", formatPercent(data.growth?.aov || 0));

  const occEl = document.getElementById("dash-occupancy");
  const occPercentEl = document.getElementById("dash-occupancy-percent");

  if (data.occupancy) {
    if (occEl) occEl.innerText = `${data.occupancy.occupied}/${data.occupancy.total}`;
    if (occPercentEl) occPercentEl.innerText = `${data.occupancy.percent}% FULL`;
  }

  const tbody = document.getElementById("dash-transactions");
  if (tbody) {
    const trx = (data.recentTransactions || []).slice(0, 20);

    tbody.innerHTML = trx.length
      ? trx.map(t => `
        <tr>
          <td class="pl-6">${t.id}</td>
          <td class="text-center">${t.table}</td>
          <td class="pl-10">${format(t.total)}</td>
          <td class="text-center">${t.status || "-"}</td>
        </tr>
      `).join("")
      : `<tr><td colspan="5">No transactions</td></tr>`;
  }

  if (document.getElementById("shift-wait"))
    document.getElementById("shift-wait").innerText = data.shift?.waitTime || "0m";

  if (document.getElementById("shift-tips"))
    document.getElementById("shift-tips").innerText = format(data.shift?.tips || 0);

  if (document.getElementById("shift-rating"))
    document.getElementById("shift-rating").innerText = data.shift?.rating || 0;
}

  el.innerHTML = items.map(i => `

      <span>${i.nama}</span>
      <span class="text-red-400 font-bold">${i.stok}</span>
    </div>
  `).join("");
}

function paginateRecentTransactions(data) {
  const start = (recentCurrentPage - 1) * recentItemsPerPage;
  const end = start + recentItemsPerPage;
  const pageData = data.slice(start, end);

  renderTransactions(pageData);
  renderRecentPagination(data.length);
}


function renderRecentPagination(totalData) {
  const totalPages = Math.max( 1, Math.ceil(totalData / recentItemsPerPage) );

  // =========================
  // INFO
  // =========================

  const from =
    totalData === 0
      ? 0
      : (recentCurrentPage - 1) * recentItemsPerPage + 1;
  const to = Math.min( recentCurrentPage * recentItemsPerPage, totalData );
  const info = document.getElementById("recentTransactionInfo");
  if (info) { info.innerText =  `Showing ${from}-${to} of ${totalData}`;}

  // =========================
  // BUTTON
  // =========================

  const prevBtn = document.getElementById("recentPrevBtn");
  const nextBtn = document.getElementById("recentNextBtn");
  if (prevBtn) { prevBtn.disabled = recentCurrentPage <= 1; }
  if (nextBtn) { nextBtn.disabled = recentCurrentPage >= totalPages; }
}

document.addEventListener("click", function(e) {

  // PREVIOUS
  if (e.target.closest("#recentPrevBtn")) {
    if (recentCurrentPage > 1) {
      recentCurrentPage--;
      paginateRecentTransactions(recentData);

    }

  }

  // NEXT
  if (e.target.closest("#recentNextBtn")) {
    const maxPage = Math.ceil(recentData.length / recentItemsPerPage);

    if (recentCurrentPage < maxPage) {
      recentCurrentPage++;
      paginateRecentTransactions(recentData);
    }
  }
});

async function applyDateFilter() {

  const end =
    document.getElementById("endDate")?.value;

  toggleLoading(true);

  try {
	  
    // GET GROSS REVENUE DATA
    const res =
      await getGrossRevenueDataRPC(
        branchId,
        start,
        end
      );
	  
    // CACHE
    state.grossRevenueData = res;
    state.grossRevenueFilter =

function calcGrowth(today, yesterday) {
  today = Number(today) || 0;
  yesterday = Number(yesterday) || 0;
  if (yesterday === 0) return 0; 
  return ((today - yesterday) / yesterday) * 100;
}    


function renderRevenueTrend(data) {
  const container =
    document.getElementById("revenueTrendContainer");
  if (!container) return;
  container.innerHTML = "";
  if (!Array.isArray(data) || data.length === 0) {
    container.innerHTML =
      "<p class='text-xs text-muted'>No data</p>";
    return;
  }

  const max =
    Math.max(
      ...data.map(d => d.total || 0),
      1
    );

  let html =
    `<div class="flex items-end gap-3 min-w-max h-full">`;

  data.forEach(item => {

    const height =
      ((item.total || 0) / max) * 180;

    html += `
      <div class="w-10 flex flex-col items-center justify-end gap-1 flex-shrink-0">
        <div
          class="w-6 bg-primary rounded-t-sm"
          style="height:${height}px">
        </div>

        <span class="text-[10px] text-muted whitespace-nowrap">
          ${item.date ? item.date.slice(5, 10) : "-"}
        </span>
      </div>
    `;

  });

  html += `</div>`;
  container.innerHTML = html;
}

 function renderDonut(data) {
  const svg = document.getElementById("grossRevenueDonut");
  const legend = document.getElementById("donutLegend");
  if (!svg || !legend) return;

  svg.innerHTML = `
    <circle cx="80" cy="80" r="50"
      stroke="#222a3d"
      stroke-width="12"
      fill="transparent"></circle>
  `;
  legend.innerHTML = "";
  const cleanData = (data || [])
  .map(d => ({
    category: (d.category || "").trim(),
    value: Number(d.grossRevenue) || 0
  }))
  .filter(d => d.category && d.value > 0);;
  if (!cleanData.length) return;
  const total = cleanData.reduce((a, b) => a + b.value, 0);
  const radius = 50;
  const circumference = 2 * Math.PI * radius;
  const colors = ["#f59e0b", "#8fd5ff", "#34d399", "#f472b6", "#a78bfa", "#ff5733", "#33c1ff"];
  let offset = 0;
  cleanData.forEach((item, index) =>  {
    const percent = item.value / total;
    const dash = circumference * percent;
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", "80");
    circle.setAttribute("cy", "80");
    circle.setAttribute("r", "50");
    circle.setAttribute("fill", "transparent");
    circle.setAttribute("stroke", colors[index % colors.length]);
    circle.setAttribute("stroke-width", "12");
    // FIX: TIDAK PAKAI ROTATE LAGI
    circle.setAttribute("stroke-dasharray", `${dash} ${circumference}`);
    circle.setAttribute("stroke-dashoffset", -offset);
    svg.appendChild(circle);
    offset += dash;
  });

  legend.innerHTML = cleanData.map((item, index) => {
    const percent = ((item.value / total) * 100).toFixed(0);
    return `
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-md"
            style="background:${colors[index % colors.length]}"></span>
          <span class="text-sm font-medium">${item.category}</span>
        </div>
        <span class="text-sm font-bold">${percent}%</span>
      </div>
    `;
  }).join("");
}

          trending_up
        </span>
      </td>

    </tr>
  `;
});

  // FOOTER
  const info = document.getElementById("topRevenueInfo");
  if (info) {
    const from = totalData === 0 ? 0 : start + 1;
    const to = Math.min(end, totalData);
    info.innerText = `Showing ${from}-${to} of ${totalData} Products`;
  }

  // BUTTON
  const prevBtn = document.getElementById("topRevenuePrevBtn");
  const nextBtn = document.getElementById("topRevenueNextBtn");
  if (prevBtn) {
    prevBtn.disabled = topRevenueCurrentPage <= 1;
    prevBtn.onclick = () => {
      if (topRevenueCurrentPage > 1) {
        topRevenueCurrentPage--;
        renderTopRevenueTable();
      }
    };
  }

  if (nextBtn) {
    nextBtn.disabled =
      topRevenueCurrentPage >= totalPages;
    nextBtn.onclick = () => {
      if (topRevenueCurrentPage < totalPages) {
        topRevenueCurrentPage++;
        renderTopRevenueTable();
      }
    };
  }
}

async function checkout() { 
  const btn = document.getElementById("btnCheckout");
  if (btn?.disabled) return;
  if (!state.branchId) {
    alert("Branch tidak valid");
    return;
  }
  if (isProcessing) return; 
  const table = state.currentTable || document.getElementById("table-input")?.value;
  if (!table) return alert("Pilih meja dulu");
  state.currentTable = table; 
  if (!state.user) return alert("User belum login");
  if (state.cart.length === 0) return alert("Keranjang kosong");
  if (!state.paymentMethod) return alert("Pilih pembayaran");
  isProcessing = true; //  kunci mulai
  if (btn) btn.disabled = true;
  const memberId = state.currentMember ? String(state.currentMember).trim() : null;
  const calc = calculateTotal();
  const totalPointUsed = state.cart
      .filter(i => i.isRedeem)
      .reduce((sum, i) => sum + (i.pointUsed || 0), 0);

  const payload = {
      requestId: crypto.randomUUID(),
      userId: state.user.username,
      branchId: state.branchId, 
      mejaId: state.currentTable,
      memberId: memberId,
      pointUsed: totalPointUsed,

  items: state.cart.map(i => ({
    id: i.id,
    name: i.name,
    qty: i.qty,
    price: i.price,
    category: i.category || "",
    subtotal: i.qty * i.price,
    isRedeem: i.isRedeem || false,
    pointUsed: i.pointUsed || 0 ,
    rewardId: i.isRedeem ? i.rewardId : null 
  })),

      subtotal: calc.subtotal,
      discount: calc.discount,
      tax: calc.tax,
      service: calc.service,
      total: calc.total,
      paymentMethod: state.paymentMethod
  };

  async function hitungHPPDanKirim(payload) {
	  let hppTotal = 0;
	  const norm = v =>
	    String(v || "")
	      .trim()
	      .toUpperCase();
		
	  state.cart.forEach(item => {
	    const r =
	      state.recipeMap[norm(item.id)] ||
	      state.recipeMap[norm(item.name)];
	    if (!r) return;
	    const cost =
	      Number(r.cost) || 0;
	    hppTotal +=
	      cost * item.qty;
	  });
	  payload.hppTotal = hppTotal;
	  await sendTransaction(payload);
	} 
    if (memberId) {

	  try {
	
	    const member =
	      await checkMemberRPC(memberId);
	
	    console.log(
	      "CHECK MEMBER RESULT:",
	      member
	    );
	
	    if (!member) {
	
	      alert(
	        "Member tidak ditemukan ❌"
	      );
	
	      isProcessing = false;
	
	      if (btn) {
	        btn.disabled = false;
	      }
	
	      return;
	    }
	
	    payload.memberId =
	      member.id;
	
	    console.log(
	      "FINAL MEMBER ID:",
	      payload.memberId
	    );
	
	    console.log(
	      "FINAL PAYLOAD:",
	      payload
	    );
	
	    // LANJUT HITUNG HPP + KIRIM TRANSAKSI
	    await hitungHPPDanKirim(payload);
	
	  } catch (error) {
	
	    console.error(
	      "CHECK MEMBER ERROR:",
	      error
	    );
	
	    alert(
	      "Gagal memeriksa member ❌"
	    );
	
	    isProcessing = false;
	
	    if (btn) {
	      btn.disabled = false;
	    }
	
	    return;
	  }
	
	} else {
	
	  await hitungHPPDanKirim(payload);
	
	}
}	

async function sendTransaction(payload){
  if (!payload) {
    alert("Payload NULL");
    return;
  }

  try {
    isProcessing = true;
    const btn =
      document.getElementById(
        "btnCheckout"
      );
    if(btn){
      btn.disabled = true;
    }
    // TEMP DATA SUPABASE
  	console.log(
	  "SEND TRANSACTION PAYLOAD:",
	  JSON.stringify(payload, null, 2)
	);
	
	const res =

function addToCartFromFilter(id) {
  const product = state.recipes.find(r =>
    String(r.id || r.ID || r.productId).toLowerCase() === String(id).toLowerCase()
  );
  if (!product) return;
  const existing = state.cart.find(i => i.id === id);
  if (existing) {
    existing.qty++;
  } else {
      state.cart.push({
        id: product.ID_Produk,
        name: product.Nama_Produk,
        price: Number(product.Harga || 0),
        qty: 1,
        note: "",
        isRedeem: false,
        productId: product.ID_Produk,
        rewardId: null
      });
  }
  renderCart(); 
}

function addToCartById(id, isRedeem = false, rewardId = null) {
  const product = state.products.find(p => p.ID_Produk === id);
  if (!product) return;
  addToCart(product, isRedeem, rewardId);
}

function addToCart(product, isRedeem = false, rewardId = null) {
  // VALIDASI MEMBER kalau redeem
  if (isRedeem) {
    if (!state.currentMember) {
      alert("Pilih member dulu!");
      return;
    }
    if (!state.currentMemberPoint) {
      alert("Point member belum dimuat");
      return;
    }
    if (!rewardId) {
      alert("Reward tidak valid!");
      return;
    }
  }
  const existing = state.cart.find(
    i => i.id === product.ID_Produk && i.isRedeem === isRedeem
  );
  if (existing) {
    existing.qty++;
    //  PENTING: paksa rewardId tetap ada
    if (isRedeem) {
      existing.rewardId = rewardId;
    }
  } else {
    state.cart.push({
      id: product.ID_Produk,
      name: product.Nama_Produk,
      price: isRedeem ? 0 : Number(product.Harga || 0),
      qty: 1,
      note: "",
      isRedeem: isRedeem,
      productId: product.ID_Produk,
      rewardId: isRedeem ? rewardId : null
    });
  }
  renderCart();
}

async function removeItemById(id) {

    state.cart.findIndex(
      i => i.id === id
    );

    return;
  }

  // Hapus dari cart lokal
  state.cart.splice(
    index,

  if (state.user) {

        await removeItemFromCartRPC(
          state.user.id,

function updateSummary(subtotal, member = null) {
  const el = document.getElementById("pos-cart-summary");
  if (!el) return;
  const taxRate = state.settings?.tax || 0;
  const serviceRate = state.settings?.service || 0;
  const isMember = state.currentMember && state.currentMember !== "";
  const discountRate = isMember
    ? (state.settings?.discount || 0)
    : 0;
  const discount = isMember
    ? subtotal * discountRate / 100
    : 0;
  const base = subtotal - discount;
  const tax = base * taxRate / 100;
  const service = base * serviceRate / 100;
  const total = base + tax + service;

  el.innerHTML = `
    <div class="flex justify-between m-3 text-sm">
      <span>Subtotal</span>
      <span>${format(subtotal)}</span>
    </div>

    <div class="flex justify-between m-3 text-sm">
      <span>Tax (${taxRate}%)</span>
      <span>${format(tax)}</span>
    </div>

    <div class="flex justify-between m-3 text-sm">
      <span>Service (${serviceRate}%)</span>
      <span>${format(service)}</span>
    </div>

    <div class="flex justify-between m-3 text-sm text-tertiary">
      <span>Discount (${discountRate}%)</span>
      <span>- ${format(discount)}</span>
    </div>

    <div class="h-[1px] my-2"></div>

    <div class="flex justify-between m-3 font-bold text-lg">
      <span>Total</span>
      <span>${format(total)}</span>
    </div>
  `;
}

function selectReward(rewardId) {
  const reward = state.rewards.find(r => r.ID_Reward == rewardId);
  if (!reward) {
    alert("Reward tidak ditemukan");
    return;
  }

  const product = state.products.find(p => p.ID_Produk == reward.Produk_ID);
  if (!product) {
    alert("Produk tidak ditemukan");
    return;
  }

  // HITUNG POINT YANG SUDAH DIPAKAI
  const totalPointUsed = state.cart
    .filter(i => i.isRedeem)
    .reduce((sum, i) => {
      const prod = state.products.find(p => p.ID_Produk == i.id);
      return sum + ((Number(prod?.Redeem_Point) || 0) * i.qty);
    }, 0);

  // CEK POINT
  if ((state.currentMemberPoint - totalPointUsed) < (Number(product.Redeem_Point) || 0)) {
    alert("Point tidak cukup");
    return;
  }

  // CEK MAX REDEEM
  const usedQty = state.cart
    .filter(i => i.isRedeem && i.id === product.ID_Produk)
    .reduce((sum, i) => sum + i.qty, 0);
  if (reward.Max_Redeem && usedQty >= reward.Max_Redeem) {
    alert("Maksimal redeem tercapai");
    return;
  }

  // MASUK CART (INI YANG HARUS KONSISTEN)
  addToCart(product, true, reward.ID_Reward);
  renderCart();
  closeRedeem();
}

    if (modal) modal.remove();

function renderMembers(data = state.members) {
  const tbody = document.getElementById("member-table-body");
  if (!tbody) return;
	
  // INIT PAGINATION
  if (!state.memberCurrentPage)
    state.memberCurrentPage = 1;
  if (!state.memberPerPage)
    state.memberPerPage = 10;
  const currentPage = state.memberCurrentPage;
  const perPage = state.memberPerPage;

  // EMPTY
  if (!data || data.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7"
            class="text-center text-muted py-6">
          No members
        </td>
      </tr>
    `;
    return;
  }

  // PAGINATION
  const totalData = data.length;
  const totalPages = Math.ceil(totalData / perPage);
  const start = (currentPage - 1) * perPage;
  const end = start + perPage;
  const paginatedData = data.slice(start, end);

  // RENDER
  tbody.innerHTML = paginatedData.map(m => `

    <tr class="hover:bg-white/5">
      <td class="px-8 py-5 text-sm font-mono text-primary">
        ${m.ID_Member}
      </td>
      <td class="px-8 py-5">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-md
                      bg-background
                      flex items-center justify-center
                      font-bold text-xs">

            ${(m.Nama || "")
              .substring(0,2)
              .toUpperCase()}
          </div>
          <span class="text-sm font-semibold">
            ${m.Nama}
          </span>
        </div>
      </td>

      <td class="px-8 py-5 text-sm">
        ${m.Level_Current || "Kenal"}
      </td>
      <td class="px-8 py-5 text-sm text-right">
        Rp ${(
          Number(
            String(m.Total_Spend || 0)
            .replace(/\./g,"")
          )
        ).toLocaleString("id-ID")}

      </td>
      <td class="px-8 py-5 text-sm font-bold text-right">
        ${m.Point || 0}
      </td>

      <td class="px-8 py-5 text-center">
      <button 
        onclick="handleMemberCard(this)"
        data-phone="${m.WA || ''}"
        data-name="${m.Nama || ''}"
        data-memberid="${m.ID_Member || ''}"
        data-level="${m.Level_Current || ''}"
        data-point="${m.Point || 0}"
        class="text-tertiary"
      >
        <span class="material-symbols-outlined">chat</span>
      </button>
      </td>
      <td class="px-8 py-5 text-right">
        <button
          class="text-muted hover:text-primary transition-colors"
          onclick="openMemberProfile('${String(m.ID_Member).trim()}')"
        >
          <span class="material-symbols-outlined">
            more_vert
          </span>
        </button>
      </td>
    </tr>
  `).join("");

  // FOOTER TEXT
  const footerText = document.querySelector("#memberPage .text-xs.text-on-surface-variant.font-medium");
  if (footerText) {
    footerText.innerText = `Showing ${paginatedData.length} of ${totalData} members`;
  }

  // PAGINATION BUTTON
  const prevBtn = document.getElementById("memberPrevBtn");
  const nextBtn = document.getElementById("memberNextBtn");
  // PREV
  if (prevBtn) {
    prevBtn.disabled =
      currentPage <= 1;
    prevBtn.onclick = () => {
      if (state.memberCurrentPage > 1) {
        state.memberCurrentPage--;
        renderMembers(data);
      }
    };
  }

  // NEXT
  if (nextBtn) {
    nextBtn.disabled =
      currentPage >= totalPages;
    nextBtn.onclick = () => {
      if (state.memberCurrentPage < totalPages) {
        state.memberCurrentPage++;
        renderMembers(data);
      }
    };
  }
}

async function sendWhatsAppComposer() {
  if (!whatsappComposerData) {
    return;
  }
  const messageEl =
    document.getElementById("waMessage");
  const message =
    messageEl
      ? messageEl.value
      : "";
  if (!message.trim()) {
    alert("Message masih kosong");
    return;
  }
  if (
    whatsappComposerData.type ===
    "transaction"
  ) {

    try {
		
      const trx =
        await getReceiptDataRPC(
          whatsappComposerData.trxId
        );
      if (!trx) {
        alert(
          "Data transaksi belum tersedia"
        );
        return;
      }
      sendReceiptWhatsappWithData(
        trx,
        whatsappComposerData.phone,
        message
      );
      closeWhatsAppModal();
    } catch (err) {
      console.error(
        "Receipt:",
        err
      );
      alert(
        "Gagal mengambil data transaksi"
      );
    }
    return;
  }
  let wa =
    String(
      whatsappComposerData.phone || ""
    )
    .replace(/\D/g, "");
  if (wa.startsWith("0")) {
    wa =
      "62" +
      wa.slice(1);
  } else if (!wa.startsWith("62")) {
    wa =
      "62" +
      wa;
  }
  const url =
    "https://api.whatsapp.com/send?phone=" +
    wa +
    "&text=" +
    encodeURIComponent(message);
  window.open(
    url,
    "_blank"
  );
  closeWhatsAppModal();
}

        "Backend mengembalikan data kosong"
      );
    }

    // Jika RPC mengembalikan success false
    if (result.success === false) {
      throw new Error(
        result.message ||
        "Gagal menyimpan member"
      );
    }

    showToast(
      "Member berhasil ditambahkan ✔",
      "success"
    );

    // Reset cache member
    state.memberPageData = null;
    state.members = null;
    resetMemberForm();
    closeAddMemberModal();
    // Reload data member
    await loadMembers();
	
  } catch (err) {
    console.error(
      "Submit Member:",
      err
    );
    showToast(
      err.message ||
      "Gagal simpan member!",
      "error"
    );
  }
}

function initMemberTabs(modal) {
  const tabs = modal.querySelectorAll("[data-tab]");
  const contents = modal.querySelectorAll("[data-tab-content]");
  function setTab(active) {

    tabs.forEach(btn => {
      const isActive = btn.dataset.tab === active;
      btn.classList.toggle("border-b-2", isActive);
      btn.classList.toggle("border-primary", isActive);
      btn.classList.toggle("text-primary", isActive);
      btn.classList.toggle("text-on-surface-variant", !isActive);
    });
    contents.forEach(sec => {
      sec.classList.toggle("hidden", sec.dataset.tabContent !== active);
    });
  }
  tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      setTab(btn.dataset.tab);
    });
  });
  setTab("personal");
}

function initMemberTabs(modal) {
  const buttons = modal.querySelectorAll("[data-tab]");
  const contents = modal.querySelectorAll(".tab-content");
  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.tab;

      // RESET BUTTON
      buttons.forEach(b => {
        b.classList.remove(
          "border-b-2",
          "border-primary",
          "text-primary",
          "font-semibold"
        );
        b.classList.add(
          "text-on-surface-variant"
        );

      });
      // ACTIVE BUTTON
      btn.classList.add(
        "border-b-2",
        "border-primary",
        "text-primary",
        "font-semibold"
      );
      btn.classList.remove(
        "text-on-surface-variant"
      );
      // HIDE CONTENT
      contents.forEach(content => {
        content.classList.add("hidden");
      });
      // SHOW TARGET
      const activeTab =
        modal.querySelector(`#${target}Tab`);
      if (activeTab) {
        activeTab.classList.remove("hidden");
      }

    });

  });

}

function renderTierTimeline(history, modal) {

    container.innerHTML = `
      <div class="text-sm text-muted">
        No tier history
      </div>
    `;
    return;
  }
	
  const settings = window.loyaltySettings || {};
  const tier1 = String(settings.tier_1_name_value || "") .toLowerCase();
  const tier2 = String(settings.tier_2_name_value || "") .toLowerCase();
  const tier3 = String(settings.tier_3_name_value || "") .toLowerCase();
  const tier4 = String(settings.tier_4_name_value || "") .toLowerCase();
  const tier5 = String(settings.tier_5_name_value || "") .toLowerCase();

    const current = index === 0;
    const year = h.year || "-";

    else if (tierLower === tier3) { description = "Demonstrated strong purchasing activity with enhanced loyalty rewards."; }
    else if (tierLower === tier2) { description = "Actively engaged through recurring visits and steady transaction growth."; }



    return `
      <div class="relative pl-10">
        <div class="
          absolute left-[15px] top-2 bottom-0 w-px
          ${current
            ? "bg-gradient-to-b from-primary to-primary-container/20"

        ">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h4 class="
                font-headline text-lg font-bold
                ${current
                  ? "text-primary"
                  : "text-on-surface"}

                ${tier} Status
              </h4>
			  
              <p class="
                font-label text-[10px]
                text-on-surface-variant

                font-bold opacity-60

              <p class="
                text-xs
                text-on-surface-variant
                leading-relaxed

            ${

                    text-primary
                    border border-primary/20
                  ">

                  </div>
                `
                : ""
            }
          </div>
        </div>

    `;
  }).join("");

  let html = "";

  (data || []).forEach(t => {

    const status = (t.status || "").toLowerCase().trim();
    const tableNumber = String(t.name || "").padStart(2, "0");
    if (status === "available") available++;
    else if (status === "occupied") occupied++;
    else if (status === "reserved") reserved++;
    if (status === "occupied") {
      html += `
        <div
          onclick="selectTable('${t.id}')"
          class="bg-background rounded-md overflow-hidden
            border border-white/10
            shadow-[0_2px_10px_rgba(0,0,0,0.15)]
            p-6 relative hover:bg-white/5 transition">
          <div class="flex justify-between mb-2">
            <span class="px-2 py-1 rounded-md bg-background border border-white/10 font-bold text-2xl">${tableNumber}</span>
            <span class="text-xs font-bold text-primary">Occupied</span>
          </div>
          <p>IDR ${t.total || 0}</p>
          <p class="text-sm">${t.guest || "-"}</p>
        </div>
      `;
    }

    else if (status === "reserved") {
      html += `
        <div
        onclick="selectTable('${t.id}')"
        class="bg-background rounded-md overflow-hidden
            border border-white/10
            shadow-[0_2px_10px_rgba(0,0,0,0.15)]
            p-6 relative hover:bg-white/5 transition">
          <div class="flex justify-between mb-2">
            <span class="font-bold text-2xl">${tableNumber}</span>
            <span class="text-xs text-primary">Reserved</span>
          </div>
          <p>${t.guest || "-"}</p>
          <p class="text-sm">${t.note || "-"}</p>
        </div>
      `;
    }

    else {
      html += `
        <div
        onclick="selectTable('${t.id}')"
        class="bg-background rounded-md overflow-hidden
            border border-white/10
            shadow-[0_2px_10px_rgba(0,0,0,0.15)]
            p-6 relative hover:bg-white/5 transition flex flex-col items-center cursor-pointer">
          <span class="text-2xl font-bold">${tableNumber}</span>

          <button
            class="mt-3 px-4 py-2 bg-primary/10 border border-primary/10 text-primary rounded-md">
            Open Table
          </button>

        </div>
      `;
    }

  });

  grid.innerHTML = html;
  document.getElementById("availableCount").textContent = available;
  document.getElementById("occupiedCount").textContent = occupied;
  document.getElementById("reservedCount").textContent = reserved;
}

async function saveEditSupplier() {

  if (!currentSupplierData) return;

  const supplierName =
    document.getElementById(
      "supplierNameInput"
    );

  const category =
    document.getElementById(
      "supplierCategoryInput"
    );

  const contact =
    document.getElementById(
      "supplierContactInput"
    );

  const phone =
    document.getElementById(
      "supplierPhoneInput"
    );

  const notes =
    document.getElementById(
      "supplierAddressInput"
    );

  const status =
    document.getElementById(
      "supplierStatusInput"
    );

  if (
    !supplierName ||
    !category ||
    !contact ||
    !phone ||
    !notes ||
    !status
  ) {
    return;
  }

  const payload = {

    supplierId:
      currentSupplierData.id,

    branchId:
      currentSupplierData.branchId,

    supplierName:
      supplierName.value,

    category:
      category.value,

    contactPerson:
      contact.value,

    phone:
      phone.value,

    notes:
      notes.value,

    status:
      status.checked

  };

  try {

    // ==============================
    // UPDATE SUPPLIER
    // ==============================

    const {
      data: updateData,
      error: updateError
    } =
      await supabaseClient.rpc(
        "update_supplier",
        {
          p_supplier_id:
            payload.supplierId,

          p_branch_id:
            payload.branchId,

          p_name:
            payload.supplierName,

          p_category:
            payload.category,

          p_contact:
            payload.contactPerson,

          p_phone:
            payload.phone,

          p_status:
            payload.status
              ? "Active"
              : "INACTIVE",

          p_notes:
            payload.notes
        }
      );

    if (updateError) {
      throw updateError;
    }

    // ==============================
    // LOAD ULANG SUPPLIER
    // ==============================

    const {
      data: suppliers,
      error: suppliersError
    } =
      await supabaseClient.rpc(
        "get_suppliers",
        {
          p_branch_id:
            payload.branchId
        }
      );

    if (suppliersError) {
      throw suppliersError;
    }

    // ==============================
    // UPDATE CACHE
    // ==============================

    allSupplierData =
      suppliers || [];

    state.supplierData =
      suppliers || [];

    state.supplierBranchId =
      payload.branchId;

    // ==============================
    // RENDER
    // ==============================

    renderSuppliers();

    closeEditSupplierModal();

    showToast(
      "Supplier updated",
      "success"
    );

  }
  catch (err) {

    console.error(
      "Update Supplier Error:",
      err
    );

    showToast(
      err?.message ||
      "Failed update supplier",
      "error"
    );
  }
}

function renderSupplierPagination() {
  const container = document.getElementById("supplierPagination");
  if (!container) return;
  const totalPages = Math.ceil(allSupplierData.length / supplierItemsPerPage);
  let html = `
    <div class="flex items-center gap-2">

      <button
        onclick="changeSupplierPage(${supplierCurrentPage - 1})"
        ${supplierCurrentPage === 1 ? "disabled" : ""}
        class="
          p-2 rounded-lg
          ${supplierCurrentPage === 1
            ? "text-slate-600 cursor-not-allowed"
            : "text-muted hover:text-muted"}
        "
      >
        <span class="material-symbols-outlined text-lg">
          chevron_left
        </span>
      </button>
  `;

  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button
        onclick="changeSupplierPage(${i})"
        class="
          w-8 h-8 rounded-lg text-xs font-bold transition-colors
          ${supplierCurrentPage === i
            ? "text-white"
            : "text-muted hover:bg-white/5"}
        "
      >
        ${i}
      </button>
    `;
  }

  html += `
      <button
        onclick="changeSupplierPage(${supplierCurrentPage + 1})"
        ${supplierCurrentPage === totalPages ? "disabled" : ""}
        class="
          p-2 rounded-lg
          ${supplierCurrentPage === totalPages
            ? "text-slate-600 cursor-not-allowed"
            : "text-muted hover:text-muted"}
        "
      >
        <span class="material-symbols-outlined text-lg">
          chevron_right
        </span>
      </button>

    </div>
  `;
  container.innerHTML = html;
}

function changeSupplierPage(page) {
  const totalPages = Math.ceil(
    allSupplierData.length / supplierItemsPerPage
  );
  if (page < 1 || page > totalPages) return;
  supplierCurrentPage = page;
  renderSuppliers();
}

      state.recipeData;

    renderRecipes();

    return;

  try {

    // ==============================
    // SUPABASE RPC
    // ==============================

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "get_recipe_list",
      {
        p_branch_id:
          branchId
      }
    );

    if (error) {
      throw error;

    // ==============================
    // CACHE
    // ==============================

      data || [];

    allRecipesData =
      data || [];

    state.recipeData =
      data || [];

    state.recipeDataBranchId =
      branchId;

    // ==============================

    // ==============================

    const tbody =
      document.getElementById(
        "recipesTable"
      );

    if (!tbody) {
      return;
    }

    renderRecipes();

  catch (err) {

    console.error(
      "Load Recipes Error:",
      err
    );

    showToast(
      err?.message ||
      "Gagal memuat recipes.",
      "error"
    );
  }
}

function setupAdjustLogic(item) {
  currentMode = "add";
  const qtyInput = document.getElementById("modalQty");
  const projected = document.getElementById("projectedStock");
  const btnAdd = document.getElementById("btnAdd");
  const btnSub = document.getElementById("btnSubtract");
  const btnSet = document.getElementById("btnSet");
	
  function setActive(activeBtn) {
    [btnAdd, btnSub, btnSet].forEach(btn => {
      btn.classList.remove("btn-active");
      btn.classList.add("btn-inactive");
    });
    activeBtn.classList.remove("btn-inactive");
    activeBtn.classList.add("btn-active");
  }

  function calculate() {
    const qty = Number(qtyInput.value || 0);
    let result = item.qty;
    if (currentMode === "add") result += qty;
    if (currentMode === "subtract") result -= qty;
    if (currentMode === "set") result = qty;
    projected.innerHTML = `${result} <span class="text-xs ml-1 text-muted"></span>`;
  }
  btnAdd.onclick = () => {
    currentMode = "add";
    setActive(btnAdd);
    calculate();
  };
  btnSub.onclick = () => {
    currentMode = "subtract";
    setActive(btnSub);
    calculate();
  };
  btnSet.onclick = () => {
    currentMode = "set";
    setActive(btnSet);
    calculate();
  };
  qtyInput.addEventListener("input", calculate);
  setActive(btnAdd);
  calculate();
}

function renderUsageSummary(data, currentStock) {
  const currentStockEl = document.getElementById("usageCurrentStock");
  const totalOutEl = document.getElementById("usageTotalOut");
  const avgDailyEl = document.getElementById("usageAvgDaily");
  if (
    !currentStockEl ||
    !totalOutEl ||
    !avgDailyEl
  ) {
    return;
  }
  if (!data.length) {
    currentStockEl.innerText = urrentStock;
    totalOutEl.innerText = 0;
    avgDailyEl.innerText = 0;
    return;
  }
  const totalOut = data
    .filter(r => r.action === "OUT")
    .reduce(
      (sum, r) =>
        sum + (Number(r.qtyChange) || 0),
      0
    );
  const uniqueDays = new Set(
    data.map(r =>
      new Date(r.timestamp)
        .toDateString()
    )
  ).size || 1;
  const avgDaily = totalOut / uniqueDays;
  const remainingDays =
    avgDaily > 0
      ? currentStock / avgDaily
      : 0;
  currentStockEl.innerText = Number(currentStock || 0).toFixed(0);
  totalOutEl.innerText = totalOut.toFixed(0);
  avgDailyEl.innerText = remainingDays.toFixed(1);
}

function renderUsageLog(data) {
  const tbody =
    document.getElementById(
      "usageLogTableBody"
    );
  if (!tbody) return;
  tbody.innerHTML = "";
  if (!data.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5"
            class="py-8 text-center text-on-surface-variant">
          Tidak ada riwayat
        </td>
      </tr>
    `;
    return;
  }

  data
  .sort(
    (a, b) =>
      new Date(b.timestamp) -
      new Date(a.timestamp)
  )
  .slice(0, 10).forEach(log => {
    let badgeColor = "text-tertiary";
    let badgeName = "POS Deduction";
    if (
      log.action === "add"
    ) {
      badgeColor = "text-primary";
      badgeName = "Manual Add";
    }
    if (
      log.action === "subtract"
    ) {
      badgeColor = "text-error";
      badgeName = "Manual Subtract";
    }
    if (
      log.action === "set"
    ) {
      badgeColor = "text-secondary";
      badgeName = "Stock Set";
    }
    const qtyColor =
      log.qtyChange >= 0
        ? "text-primary"
        : "text-error";
    const qtyText =
      log.qtyChange >= 0
        ? `+${log.qtyChange}`
        : `${log.qtyChange}`;
    const parts = String(log.timestamp) .split(" ");
    const date = parts[0] || "-";
    const time = parts[1] || "-";

    tbody.innerHTML += `
      <tr class="hover:bg-white/5 transition-colors">
        <td class="py-5 px-6">
          <div class="flex flex-col">
            <span class="text-on-surface font-medium">
              ${date}
            </span>

            <span class="text-xs text-on-surface-variant opacity-60">
              ${time}
            </span>
          </div>
        </td>
		
        <td class="py-5 px-6">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-white/5 text-xs font-semibold ${badgeColor}">
            <span class="w-1.5 h-1.5 rounded-md bg-current"></span>
            ${badgeName}
          </span>
        </td>

        <td class="py-5 px-6 text-on-surface-variant font-mono text-sm">
          ${log.notes || "-"}
        </td>

        <td class="py-5 px-6 text-right font-display font-bold ${qtyColor}">
          ${qtyText}g
        </td>

        <td class="py-5 px-6 text-right font-display font-medium text-on-surface">
          ${log.after}
        </td>
      </tr>
    `;
  });
}

async function saveRecipe() {

  const productId =
    document.getElementById(
      "recipeProductSelect"
    ).value;

  if (!productId) {

    alert(
      "Pilih produk dulu"
    );

    return;
  }


  const ingredients = [];

  document
    .querySelectorAll(
      ".ingredient-row"
    )
    .forEach(row => {

      const ingredientId =
        row.querySelector(
          ".ingredient-select"
        ).value;

      const qty =
        row.querySelector(
          ".ingredient-qty"
        ).value;

      const unit =
        row.querySelector(
          ".ingredient-unit"
        ).value;


      if (
        ingredientId &&
        qty
      ) {

        ingredients.push({

          ingredientId,

          qty:
            Number(qty),

          unit

        });

      }

    });


  if (!ingredients.length) {

    alert(
      "Tambahkan ingredient dulu"
    );

    return;
  }


  const payload = {

    productId,

    ingredients,

    branchId:
      state.branchId

  };


  try {

    // ==================================
    // SUPABASE RPC
    // ==================================

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "save_recipe",
      {
        p_payload:
          payload
      }
    );


    if (error) {
      throw error;
    }


    // ==================================
    // CLEAR CACHE
    // ==================================

    state.inventoryData = null;
    state.inventoryBranchId = null;

    state.recipeData = null;
    state.recipeDataBranchId = null;

    state.recipes = null;


    // ==================================
    // RELOAD
    // ==================================

    await loadInventoryPage(
      state.branchId
    );

    await loadRecipes();


    alert(
      "Recipe berhasil disimpan"
    );

  }
  catch (err) {

    console.error(
      "Save Recipe Error:",
      err
    );

    alert(
      err?.message ||
      "Gagal menyimpan recipe"
    );
  }
}

      );

      document.getElementById(
        "branchSelect"
      );

    // CLEAR OPTIONS
    // ==============================

    if (materialSelect) {
      materialSelect.innerHTML = "";
    }

    if (supplierSelect) {

    }

    if (stockBranchSelect) {
      stockBranchSelect.innerHTML = "";
    }

    branches.forEach(branch => {

          branch.id;

            "option"

        option.textContent =
          branch.name;

        );

          document.createElement(
            "option"
          );

        option.value =

async function compressImage(file, maxWidth = 1200, quality = 0.8) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height =
          height *
          (maxWidth / width);
        width = maxWidth;
      }
      const canvas =
        document.createElement(
          "canvas"
        );
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );
      canvas.toBlob(
        blob => resolve(blob),
        "image/jpeg",
        quality
      );
    };
    img.src = URL.createObjectURL(file);
  });
}

function fileToBase64(fileOrBlob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () =>
      resolve(reader.result);
    reader.readAsDataURL(fileOrBlob);
  });
}

function initAnalyticsDate() {
  const startEl = document.getElementById("analyticsStartDate");
  const endEl = document.getElementById("analyticsEndDate");
  if (!startEl || !endEl) return;
  // kalau sudah ada nilai jangan timpa
  if (startEl.value && endEl.value) {
    return;
  }
  const today = new Date();
  const lastWeek = new Date(today.getTime() - 6 * 24 * 60 * 60 * 1000);
  endEl.value = today.toISOString().split("T")[0];
  startEl.value = lastWeek.toISOString().split("T")[0];
}

function renderWeeklyChart(weekly) {
  const container = document.getElementById("weeklyChart");
  if (!container) return;
  container.innerHTML = "";
  const max = Math.max(...weekly, 1);
  weekly.forEach((val, i) => {
    const prev = weekly[i - 1] || val;
    const height = (val / max) * 100;
    let colorClass = "bg-white/5";
    // WARNA HALUS (bukan ngejreng)
    if (val > prev) {
      colorClass = "bg-emerald-400/70 hover:bg-emerald-400";
    } else if (val < prev) {
      colorClass = "bg-red-400/70 hover:bg-red-400";
    } else {
      colorClass = "bg-white/5 hover:bg-primary-container";
    }
    // LAST BAR (highlight kayak contoh lo)
    if (i === weekly.length - 1) {
      colorClass = "bg-primary-container";
    }
    const bar = document.createElement("div");
    bar.className = `
      flex-1 
      ${colorClass} 
      rounded-t-md 
      transition-all duration-300 
      hover:scale-y-105
    `;
    bar.style.height = height + "%";
    // tooltip
    bar.title = "Rp " + val.toLocaleString("id-ID");
    container.appendChild(bar);
  });
}

let analyticsLoading = false;
async function loadAnalyticsPage() {

  if (analyticsLoading) return;

  analyticsLoading = true;

  try {

    const startEl =
      document.getElementById(
        "analyticsStartDate"
      );

    const endEl =
      document.getElementById(
        "analyticsEndDate"
      );

    if (!startEl || !endEl) {
      return;
    }

    const startDate =
      startEl.value;

    const endDate =
      endEl.value;

    if (!startDate || !endDate) {
      return;
    }

    const cacheKey =
      JSON.stringify({
        branchId: state.branchId,
        startDate,
        endDate
      });


    // ==========================
    // CACHE
    // ==========================

    if (
      state.analyticsData &&
      state.analyticsFilter === cacheKey
    ) {

      renderAnalyticsPageData(
        state.analyticsData
      );

      return;
    }


    // ==========================
    // SUPABASE RPC
    // ==========================

    const res =
      await getAnalyticsDashboardRPC(
        state.branchId,
        startDate,
        endDate
      );

    console.log(
      "ANALYTICS DASHBOARD:",
      res
    );
	  

    // ==========================
    // VALIDASI
    // ==========================

    if (!res) {
      throw new Error(
        "Data analytics tidak ditemukan"
      );
    }


    // ==========================
    // CACHE
    // ==========================

    state.analyticsData =
      res;

    state.analyticsFilter =
      cacheKey;


    // ==========================
    // RENDER
    // ==========================

    renderAnalyticsPageData(
      res
    );

  }

  catch (err) {

    console.error(
      "Analytics:",
      err
    );

    showToast(
      err?.message ||
      "Gagal load analytics",
      "error"
    );

  }

  finally {

    analyticsLoading = false;

  }

}

  try {

      QRIS: "bg-[#F59E0B]",

function renderHeatmap(data) {
  const container = document.getElementById("heatmapGrid");
  if (!container) return;
  container.innerHTML = "";
  if (!data || !Array.isArray(data)) return;
  const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  // cari max
  let max = 0;
  data.forEach(day => {
    if (!Array.isArray(day)) return;
    day.forEach(v => {
      if (v > max) max = v;
    });
  });
  if (max === 0) max = 1;
  data.forEach((day, i) => {
    const col = document.createElement("div");
    col.className = "flex flex-col gap-[2px] flex-1";
    if (!Array.isArray(day)) return;
    // 24 jam cell
    day.forEach((value, hour) => {
      const ratio = value / max;
      const cell = document.createElement("div");
      cell.className = "flex-1 min-h-[6px] rounded-sm";
      if (ratio > 0.75) {
        cell.classList.add("bg-primary-container");
      } else if (ratio > 0.5) {
        cell.classList.add("bg-amber-500/80");
      } else if (ratio > 0.25) {
        cell.classList.add("bg-amber-500/40");
      } else if (ratio > 0) {
        cell.classList.add("bg-amber-500/20");
      } else {
        cell.classList.add("bg-white/5");
      }
      // optional tooltip biar enak
      cell.title = `${days[i]} ${hour}:00 = ${value}`;
      col.appendChild(cell);
    });
    // label hari
    const label = document.createElement("span");
    label.className = "text-[10px] text-muted  text-center font-bold mt-2";
    label.innerText = days[i] || "-";
    col.appendChild(label);
    container.appendChild(col);
  });
}

function renderRawMaterialPagination() {
  const info =
    document.getElementById(
      "rawMaterialPaginationInfo"
    );
  const pagination =
    document.getElementById(
      "rawMaterialPagination"
    );
  const prevBtn =
    document.getElementById(
      "rawMaterialPrev"
    );
  const nextBtn =
    document.getElementById(
      "rawMaterialNext"
    );

  if (
    !info ||
    !pagination ||
    !prevBtn ||
    !nextBtn
  ) return;
  const total = rawMaterialData.length;
  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total /
        rawMaterialPerPage
      )
    );
  const start =
    total === 0
      ? 0
      : ((rawMaterialPage - 1) *
          rawMaterialPerPage) + 1;
  const end =
    Math.min(
      rawMaterialPage *
      rawMaterialPerPage,
      total
    );

  info.innerHTML = `
    Showing
    <span class="text-on-surface font-bold">
      ${start}
    </span>
    to
    <span class="text-on-surface font-bold">
      ${end}
    </span>
    of
    <span class="text-on-surface font-bold">
      ${total}
    </span>
    entries
  `;
  let pagesHtml = "";
  for (
    let i = 1;
    i <= totalPages;
    i++
  ) {

    pagesHtml += `
      <button
        onclick="goToRawMaterialPage(${i})"
        class="
          w-8 h-8 rounded-md
          text-xs font-bold
          transition-all
          ${
            i === rawMaterialPage
              ? "bg-amber-500 text-black"
              : "bg-white/5 text-muted hover:text-white"
          }
        ">
        ${i}
      </button>
    `;
  }
  pagination.innerHTML = pagesHtml;
  prevBtn.disabled = rawMaterialPage === 1;
  nextBtn.disabled = rawMaterialPage === totalPages;
  prevBtn.onclick = () => {
    if (
      rawMaterialPage > 1
    ) {
      rawMaterialPage--;
      renderRawMaterialPage();
    }
  };
  nextBtn.onclick = () => {
    if (
      rawMaterialPage <
      totalPages
    ) {
      rawMaterialPage++;
      renderRawMaterialPage();
    }
  };
}

function goToRawMaterialPage(page) {
  rawMaterialPage = page;
  renderRawMaterialPage();
}

async function exportAnalyticsPDF() {

  const start =
    document.getElementById(
      "analyticsStartDate"
    )?.value;

  const end =
    document.getElementById(
      "analyticsEndDate"
    )?.value;

  const branchId =
    state.branchId;


  // =========================
  // VALIDASI
  // =========================

  if (!start || !end) {

    alert(
      "Pilih tanggal dulu"
    );

    return;

  }


  if (!branchId) {

    alert(
      "Branch tidak valid"
    );

    return;

  }


  // =========================
  // OPEN TAB
  // =========================

  const pdfTab =
    window.open(
      "",
      "_blank"
    );


  if (!pdfTab) {

    alert(
      "Popup diblokir browser"
    );

    return;

  }


  // =========================
  // LOADING PAGE
  // =========================

  pdfTab.document.write(`
    <!DOCTYPE html>

    <html>

    <head>

      <title>
        Analytics Report
      </title>

      <style>

        body {

          background:#0B0F14;

          color:white;

          font-family:Arial;

          display:flex;

          align-items:center;

          justify-content:center;

          height:100vh;

          margin:0;

        }

        .loading {

          text-align:center;

        }

        .title {

          font-size:18px;

          font-weight:bold;

          margin-bottom:8px;

        }

        .subtitle {

          font-size:13px;

          opacity:.7;

        }

      </style>

    </head>


    <body>

      <div class="loading">

        <div class="title">

          Analytics Report

        </div>

        <div class="subtitle">

          Generating PDF...

        </div>

      </div>

    </body>

    </html>
  `);

  pdfTab.document.close();


  // =========================
  // CALL VERCEL API
  // =========================

  try {

    console.log(
      "EXPORT ANALYTICS:",
      {
        branchId,
        start,
        end
      }
    );


    const response =
      await fetch(
        "/api/export-analytics-pdf",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:JSON.stringify({

            branchId,

            start,

            end

          })

        }
      );


    // =========================
    // HTTP ERROR
    // =========================

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        `Export gagal (${response.status})`
      );

    }


    // =========================
    // API RETURN
    // =========================

    const result =
      await response.text();


    console.log(
      "EXPORT ANALYTICS RESULT:",
      result
    );


    if (!result) {

      throw new Error(
        "Server tidak mengembalikan hasil PDF"
      );

    }


    // =========================
    // JIKA API RETURN URL
    // =========================

    if (
      result.startsWith("http://") ||
      result.startsWith("https://") ||
      result.startsWith("/")
    ) {

      pdfTab.location.href =
        result;

      return;

    }


    // =========================
    // JIKA API RETURN HTML
    // =========================

    pdfTab.document.open();

    pdfTab.document.write(
      result
    );

    pdfTab.document.close();

  }


  // =========================
  // ERROR
  // =========================

  catch(err) {

    console.error(
      "Export Analytics:",
      err
    );


    pdfTab.document.open();

    pdfTab.document.write(`

      <!DOCTYPE html>

      <html>

      <body style="
        background:#0B0F14;
        color:white;
        font-family:Arial;
        padding:40px;
      ">

        <h2>
          Failed Generate PDF
        </h2>

        <p style="
          color:#aaa;
        ">
          Gagal membuat Analytics Report.
        </p>

        <pre style="
          white-space:pre-wrap;
          background:#151A21;
          padding:15px;
          border-radius:10px;
        ">${String(
          err?.message ||
          err
        )}</pre>

      </body>

      </html>

    `);

    pdfTab.document.close();

  }

}

    select.innerHTML = branches.map(b => `
      <option value="${b.branchId}">
        ${b.branchName}
      </option>
    `).join("");
    // default
    select.value = state.branchId;
    select.disabled = false;
    select.onchange = function () {
      state.branchId = this.value;
      reloadCurrentPage();
    };
  } 
  // ADMIN / CASHIER
  else {
    const userBranch = branches.find(
      b => b.branchId === state.user.branchId
    );
    select.innerHTML = `
      <option value="${state.user.branchId}">
        ${userBranch 
          ? userBranch.branchName 
          : state.user.branchId}
      </option>
    `;
    select.value = state.user.branchId;
    // kunci dropdown
    select.disabled = true;
    state.branchId = state.user.branchId;
    select.onchange = null;
  }
}

function renderBranchPagination() {
  const pagination = document.getElementById("branchPagination");
  if (!pagination) return;
  const totalData = allBranches.length;
  const totalPages = Math.ceil(totalData / branchPerPage);
  // Info Showing
  document.getElementById("branchShowingStart").textContent =
    totalData === 0
      ? 0
      : (branchCurrentPage - 1) * branchPerPage + 1;
  document.getElementById("branchShowingEnd").textContent =
    Math.min(branchCurrentPage * branchPerPage, totalData);
  document.getElementById("branchTotalData").textContent = totalData;
  let html = "";
  // Previous
  html += `
    <button
      onclick="changeBranchPage(${branchCurrentPage - 1})"
      ${branchCurrentPage === 1 ? "disabled" : ""}
      class="px-3 py-2 disabled:opacity-40 disabled:cursor-not-allowed">
      ‹
    </button>
  `;
  // Number
  for (let i = 1; i <= totalPages; i++) {
    html += `
      <button
        onclick="changeBranchPage(${i})"
        class="w-7 h-7 rounded-lg transition text-xs font-bold
        ${
          i === branchCurrentPage
            ? 'text-white'
            : 'text-muted  hover:bg-white/5'}
        }">
        ${i}
      </button>
    `;
  }
  // Next
  html += `
    <button
      onclick="changeBranchPage(${branchCurrentPage + 1})"
      ${branchCurrentPage === totalPages || totalPages === 0 ? "disabled" : ""}
      class="px-3 py-2 disabled:opacity-40 disabled:cursor-not-allowed">
      ›
    </button>
  `;
  pagination.innerHTML = html;
}

function changeBranchPage(page) {
  const totalPages = Math.ceil(allBranches.length / branchPerPage);
  if (page < 1 || page > totalPages) return;
  branchCurrentPage = page;
  renderBranchTable();
}

function initBusinessLogoPreview(){
  const input = document.getElementById("businessLogoInput");
  const preview = document.getElementById("businessLogoPreview");
  if (!input || !preview) return;
  input.onchange = function(e){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      preview.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
}

  // CACHE HIT
  // =========================

    state.expenseDashboardData &&
    state.expenseDashboardFilter === filterKey
  ) {

    applyExpenseDashboard(
      state.expenseDashboardData
    );

    return;
  }


  try {

    console.log(
      "SERVER CALL getExpenseDashboardRPC"

    // CACHE
    // =========================

      filterKey;

    // =========================

function formatFileSize(bytes) {
    if (bytes === 0)
        return "0 Bytes";
    const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (Math.round(bytes / Math.pow(1024,i)
        )
        +
        " "
        +
        sizes[i]
    );
}

async function uploadExpenseAttachment() {

  const expense =
    expenseData[selectedAttachmentExpenseIndex];

  if (!expense) {
    showToast(
      "Expense tidak ditemukan",
      "error"
    );
    return;
  }

  const input =
    document.getElementById(
      "expenseAttachmentInput"
    );

  const file =
    input?.files?.[0];

  if (!file) {
    showToast(
      "Pilih file terlebih dahulu",
      "warning"
    );
    return;
  }

  try {

    showLoading();

    const ext =
      file.name
        .split(".")
        .pop()
        .toLowerCase() === "jpeg"
        ? "jpg"
        : file.name
            .split(".")
            .pop()
            .toLowerCase();

    const path =
      `${expense.branchId}/${expense.refId}/${expense.refId}_${Date.now()}.${ext}`;


    // =========================
    // UPLOAD SUPABASE STORAGE
    // =========================

    const {
      error: uploadError
    } = await supabaseClient.storage
      .from("Expense_Attachment")
      .upload(
        path,
        file,
        {
          contentType: file.type,
          upsert: false
        }
      );

    if (uploadError) {
      throw uploadError;
    }

    // =========================
    // PUBLIC URL
    // =========================

    const {
      data: publicData
    } =
      supabaseClient.storage
        .from("Expense_Attachment")
        .getPublicUrl(path);

    const url =
      publicData?.publicUrl;

    if (!url) {
      throw new Error(
        "URL attachment tidak ditemukan"
      );
    }

    // =========================
    // UPDATE DATABASE
    // =========================

    await updateExpenseAttachmentRPC({
      Ref_ID:
        expense.refId,

      Attachment_URL:
        url
    });

    showToast(
      "Attachment berhasil disimpan",
      "success"
    );

    closeExpenseAddAttachmentModal();
    state.expenseDashboardData = null;
    state.expenseDashboardFilter = null;
    await loadExpenseDashboard();

  }
  catch (err) {

    console.error(
      "Upload expense attachment:",
      err
    );

    showToast(
      err.message ||
      "Upload attachment gagal",
      "error"
    );

  }
  finally {

    hideLoading();

  }
}

          date:
            item.date
              ? String(item.date).trim()
              : ""
        }))
      : [];

  filteredOtherIncomeData =
    [...allOtherIncomeData];
  renderOtherIncomeTable();
}

function getOtherIncomeFilters() {
  return {
    keyword:
      document.getElementById("otherIncomeSearchInput")?.value || "",
    category:
      document.getElementById("otherIncomeCategoryFilter")?.value || "ALL",
    status:
      document.getElementById("otherIncomeStatusFilter")?.value || "ALL",
    branch:
      document.getElementById("otherIncomeBranchFilter")?.value || "ALL",
    startDate:
      document.getElementById("expenseStartDate")?.value || "",
    endDate:
      document.getElementById("expenseEndDate")?.value || ""
  };
}

function filterOtherIncomeTable() {
  const f = getOtherIncomeFilters();
  filteredOtherIncomeData = allOtherIncomeData.filter(item => {
    // SEARCH
    const keyword =
      (f.keyword || "").toLowerCase();
    const text =
      `${item.description || ""}
       ${item.category || ""}
       ${item.refId || ""}
       ${item.notes || ""}
       ${item.method || ""}`
      .toLowerCase();
    const matchSearch =
      !keyword ||
      text.includes(keyword);
    // CATEGORY
    const matchCategory =
      f.category === "ALL" ||
      f.category === "All Categories" ||
      item.category === f.category;
    // STATUS
    const matchStatus =
      f.status === "ALL" ||
      f.status === "All Status" ||
      item.status === f.status;
    // BRANCH
    const matchBranch =
      f.branch === "ALL" ||
      String(item.branchId || "")
        .trim()
        .toUpperCase()
        ===
      String(f.branch || "")
        .trim()
        .toUpperCase();
    // DATE RANGE
    let itemDate = null;
    if (item.date) {
      itemDate =
        new Date(item.date + "T00:00:00");
    }
    const matchStart =
      !f.startDate ||
      (
        itemDate &&
        itemDate >=
        new Date(f.startDate + "T00:00:00")
      );
    const matchEnd =
      !f.endDate ||
      (
        itemDate &&
        itemDate <=
        new Date(f.endDate + "T23:59:59")
      );
    return (
      matchSearch &&
      matchCategory &&
      matchStatus &&
      matchBranch &&
      matchStart &&
      matchEnd
    );
  });
  otherIncomeCurrentPage = 1;
  window.currentOtherIncomeFiltered =
    filteredOtherIncomeData;
  renderOtherIncomeTable();
}

async function saveOtherIncomeStatus() {

  if (!selectedOtherIncome) {
    showToast(
      "Data tidak ditemukan",
      "error"
    );
    return;
  }

  const status =
    document.getElementById(
      "editOtherIncomeStatus"
    )?.value;

  if (!status) {
    showToast(
      "Status tidak dipilih",
      "warning"
    );
    return;
  }

  try {

    const res =
      await updateOtherIncomeStatusRPC(
        selectedOtherIncome.refId,
        status
      );

    if (
      res &&
      res.success === false
    ) {
      throw new Error(
        res.message ||
        "Gagal mengubah status"
      );
    }

    showToast(
      "Status berhasil diubah",
      "success"
    );

    // =========================
    // CLEAR CASH FLOW CACHE
    // =========================
    state.cashFlowData = null;
    state.cashFlowFilter = null;

    // =========================
    // CLOSE MODAL
    // =========================
    closeOtherIncomeStatusModal();

    // =========================
    // CLEAR EXPENSE CACHE
    // =========================
    state.expenseDashboardData = null;
    state.expenseDashboardFilter = null;

    // =========================
    // RELOAD
    // =========================

    await loadExpenseDashboard();

  }
  catch (err) {

    console.error(
      "Save Other Income Status:",
      err
    );

    showToast(
      err.message ||
      "Gagal mengubah status",
      "error"
    );

  }
}

function renderCategoryBreakdown() {
  const map = {};
  allExpenseData.forEach(item => {
    const status = item.status || item.Status;
    if (status !== "Paid") return;
    const amount = Number(
      item.amount || item.Amount || 0
    );
    const category =
      item.category ||
      item.Category ||
      "Other";
    map[category] =
      (map[category] || 0) + amount;
  });
  const total =
    Object.values(map)
    .reduce((a,b)=>a+b,0);
  const data = Object.keys(map).map(cat => {
    return {
      name: cat,
      amount: map[cat],
      percent: total > 0
        ? (map[cat] / total) * 100
        : 0
    };
  });
  drawCategory(data);
}

function drawCategory(data) {
  const container =
    document.querySelector("#categoryBreakdown");
  if (!container) return;
  container.innerHTML = "";
  if (!Array.isArray(data) || data.length === 0) {
    container.innerHTML =
    `<div class="text-sm text-gray-400">
      No data
    </div>`;
    return;
  }

  container.innerHTML =
  data.map(item => `

    <div class="space-y-2">
      <div class="flex justify-between text-sm">
        <span class="font-medium">
          ${item.name}
        </span>

        <span>
          ${Number(item.percent).toFixed(1)}%
        </span>
      </div>
      <div class="h-2 w-full bg-white/5 rounded-md">
        <div
          class="h-full bg-primary rounded-md"
          style="width:${item.percent}%">
        </div>
      </div>
    </div>
  `).join("");
}


function filterExpenseTable() {
  const f = getExpenseFilters();
  const filtered = allExpenseData.filter(item => {
    const keyword =
      String(f.keyword || "")
        .trim()
        .toLowerCase();
    const itemBranch =
      String(item.branchId || "")
        .trim()
        .toUpperCase();
    const filterBranch =
      String(f.branch || "")
        .trim()
        .toUpperCase();
    const matchBranch =
      filterBranch === "ALL" ||
      itemBranch === filterBranch;
    const text =
      `${item.description || ""}
       ${item.category || ""}
       ${item.refId || ""}`
        .toLowerCase();
    const matchSearch =
      text.includes(keyword);
    const matchCategory =
      f.category === "All Categories" ||
      item.category === f.category;
    const matchStatus =
      f.status === "All Status" ||
      item.status === f.status;
    const itemDate =
      item.tanggal
        ? new Date(item.tanggal)
        : null;
    const matchStart =
      !f.startDate ||
      (
        itemDate &&
        itemDate >= new Date(f.startDate)
      );
    const matchEnd =
      !f.endDate ||
      (
        itemDate &&
        itemDate <= new Date(f.endDate)
      );
    return (
      matchBranch &&
      matchSearch &&
      matchCategory &&
      matchStatus &&
      matchStart &&
      matchEnd
    );
  });
  currentPage = 1;
  window.currentFilteredData = filtered;
  paginate(filtered);
  updateExpenseKPIs(filtered);
  setTimeout(() => {
