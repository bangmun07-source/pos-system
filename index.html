		<script>
		  document.addEventListener(
			  "input",
			  async function(e) {
			    if (
			      e.target.id === "memberSearch"
			    ) {
			      const keyword =
			        e.target.value
			          .toLowerCase();
			
			      if (!keyword) {
			        document.getElementById(
			          "memberResult"
			        ).style.display = "none";
			        return;
			      }
			
			      try {
			        const data =
			          await searchMembersRPC(
			            keyword,
			            state.branchId
			          );
			
			        showMemberResult( data );
			      } catch (err) {
			      }
			    }
			  }
			);
			
			// ================================
			// TAMPILKAN HASIL MEMBER
			// ================================
			function showMemberResult(data) {
			  const box =
			    document.getElementById(
			      "memberResult"
			    );
			
			  if (!box) return;
			  box.innerHTML = "";
			
			  if (
			    !data ||
			    data.length === 0
			  ) {
			    box.style.display = "none";
			    return;
			  }
			  data.forEach(m => {
			    const div =
			      document.createElement(
			        "div"
			      );
			
			    div.style.padding = "10px";
			    div.style.cursor = "pointer";
			    div.innerHTML =
			      `<b>${m.nama}</b>
			       <br>
			       <small>${m.level}</small>`;
			
			    div.onclick = async () => {
					  await selectMember(m);
					};
			    box.appendChild(div);
			  });
			  box.style.display = "block";
			}
	  </script>

	<script>
		const card = document.getElementById("businessCard");
		if(card){
			card.addEventListener("mousemove",(e)=>{
				const rect = card.getBoundingClientRect();
				const x = e.clientX - rect.left;
				const y = e.clientY - rect.top;
				const centerX = rect.width/2;
				const centerY = rect.height/2;
				const rotateY = ((x-centerX)/centerX)*10;
				const rotateX = ((centerY-y)/centerY)*10;
				card.style.transform = `
					perspective(1200px)
					rotateX(${rotateX}deg)
					rotateY(${rotateY}deg)
					scale(1.02)
				`;
			});
			
			card.addEventListener("mouseleave",()=>{
				card.style.transform = `
					perspective(1200px)
					rotateX(0deg)
					rotateY(0deg)
					scale(1)
				`;
			});
		}
	</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration =
        await navigator.serviceWorker.register("/sw.js");
      await registration.update();
      navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {
          if (sessionStorage.getItem("swReloaded")
          ) {
            return;
          }
          sessionStorage.setItem("swReloaded","1");
          window.location.reload();
        }
      );
    }
    catch (error) {
    }
  });
}
</script>
